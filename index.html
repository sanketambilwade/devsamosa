function matchPerson(name){
  if(!name)return null;
  const n=name.trim().toLowerCase();
  let p=DB.people.find(x=>x.name.toLowerCase()===n);if(p)return p.id;
  p=DB.people.find(x=>x.name.toLowerCase().split(' ')[0]===n);if(p)return p.id;
  p=DB.people.find(x=>x.name.toLowerCase().startsWith(n)||n.startsWith(x.name.toLowerCase().split(' ')[0]));
  return p?p.id:null;
}
function matchProject(name){
  if(!name)return (DB.projects[0]||{}).id||'';
  const n=name.trim().toLowerCase();
  let p=DB.projects.find(x=>x.name.toLowerCase()===n)||DB.projects.find(x=>x.name.toLowerCase().includes(n)||n.includes(x.name.toLowerCase()));
  return p?p.id:'';
}
function localParse(text){
  const out=[];
  text.split(/\n+/).forEach(line=>{
    let l=line.trim();if(!l||l.length<4)return;
    l=l.replace(/^[-*•\d.)\s]+/,'');
    let name='',rest=l;
    const tab=l.includes('\t')?l.split('\t'):null;
    if(tab&&tab.length>=2){
      return out.push({n:tab[0],p:tab.length>3?tab[1]:'',t:tab.length>3?tab[2]:tab[1],
        e:parseFloat(tab[3]||tab[2])||0,s:'progress'});
    }
    const m=l.match(/^([A-Za-z][A-Za-z.'\- ]{1,28}?)\s*[:\-–]\s*(.+)$/);
    if(m){name=m[1];rest=m[2]}else{
      const w=l.split(/\s+/)[0];if(matchPerson(w)){name=w;rest=l.slice(w.length).trim()}else return;
    }
    const h=rest.match(/(\d+(?:\.\d+)?)\s*(?:h|hr|hrs|hour|hours|d|day|days)\b/i);
    let est=0;
    if(h){est=parseFloat(h[1]);if(/d|day/i.test(h[0]))est*=8;rest=rest.replace(h[0],'').trim()}
    let st='progress';
    if(/\bblocked?\b|\bstuck\b|\bwaiting on\b/i.test(rest))st='blocked';
    else if(/\bdone\b|\bcompleted?\b|\bfinished\b|\bmerged\b|\bshipped\b/i.test(rest))st='done';
    else if(/\bwill start\b|\bplanning to\b|\byet to\b|\bpicking up\b/i.test(rest))st='planned';
    rest=rest.replace(/[,;.\s]+$/,'');
    if(rest)out.push({n:name,p:'',t:rest,e:est,s:st});
  });
  return out;
}
async function aiParse(text){
  const roster=DB.people.map(p=>p.name).join('; ');
  const projs=DB.projects.map(p=>p.name).join('; ');
  const prompt=`You convert messy standup notes or a call transcript into structured rows.

Team roster: ${roster}
Projects: ${projs}

Rules:
- One object per task mentioned. A person may have several tasks.
- "n" must be the closest matching name from the roster, spelled exactly as in the roster. If nobody matches, use the name as heard.
- "p" must be the closest matching project name from the list, or "" if unclear.
- "t" is a short task description in your own words, under 12 words, no name prefix.
- "e" is the estimate in HOURS as a number (convert days at 8h/day). Use 0 if no estimate is given.
- "s" is one of: planned, progress, blocked, done.
- Ignore greetings, small talk, and anything that is not a work update.

Return ONLY a JSON array. No markdown fences, no commentary.
Format: [{"n":"","p":"","t":"","e":0,"s":"progress"}]

NOTES:
${text.slice(0,7000)}`;
  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})
  });
  if(!res.ok)throw new Error('http '+res.status);
  const data=await res.json();
  let txt=(data.content||[]).map(b=>b.type==='text'?b.text:'').join('').trim();
  txt=txt.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=txt.indexOf('['),b=txt.lastIndexOf(']');
  if(a<0||b<0)throw new Error('no json');
  const parsed=JSON.parse(txt.slice(a,b+1));
  if(!Array.isArray(parsed)||!parsed.length)throw new Error('empty');
  return parsed;
}

/* ==================== plan ==================== */
let planView='week', anchor=null, DRAG=null, lastShift=0;
function planRange(){
  const t=D.today();
  if(!anchor)anchor=planView==='week'?D.monday(t):D.som(t);
  if(planView==='week'){const s=D.monday(anchor);return{s,e:D.add(s,6)}}
  const s=D.som(anchor);return{s,e:D.eom(s)};
}
function shiftPlan(dir){
  const t=D.today();
  if(planView==='week')anchor=D.add(anchor||D.monday(t),dir*7);
  else{const d=D.p(anchor||D.som(t));anchor=D.iso(new Date(d.getFullYear(),d.getMonth()+dir,1))}
  render();
}
/* several projects at once: each booking gets a lane it doesn't clash in */
function laneMap(pid){
  const as=DB.allocs.filter(a=>a.personId===pid).sort((a,b)=>a.start<b.start?-1:1);
  const lanes=[],of={};
  as.forEach(a=>{
    let i=lanes.findIndex(L=>L.every(b=>b.end<a.start||b.start>a.end));
    if(i<0){i=lanes.length;lanes.push([])}
    lanes[i].push(a);of[a.id]=i;
  });
  return{list:as,of,count:Math.max(1,lanes.length)};
}
function mergeSame(pid,projectId){
  const same=DB.allocs.filter(a=>a.personId===pid&&a.projectId===projectId)
    .sort((a,b)=>a.start<b.start?-1:1);
  const keep=DB.allocs.filter(a=>!(a.personId===pid&&a.projectId===projectId));
  const out=[];
  same.forEach(a=>{const l=out[out.length-1];
    if(l&&D.diff(l.end,a.start)<=1)l.end=a.end>l.end?a.end:l.end;
    else out.push({...a})});
  DB.allocs=keep.concat(out);
}
function addBooking(pid,s,e,projectId){
  if(s>e){const x=s;s=e;e=x}
  s=nextWork(s);e=prevWork(e);
  if(s>e){toast('That range is only weekend days',1);return}
  DB.allocs.push({id:uid(),personId:pid,projectId,start:s,end:e,pct:100,note:''});
  mergeSame(pid,projectId);
}

function vPlan(){
  if(!DB.people.length)return firstRun();
  if(!DB.projects.length){$('#main').innerHTML=`<div class="glass card"><div class="empty">
    <h3>Add a project first</h3><p>You book people onto projects, so there needs to be at least one.</p>
    <button class="b p" id="np">Add a project</button></div></div>`;
    $('#np').onclick=projectForm;return}

  const {s:S,e:E}=planRange(), N=D.diff(S,E)+1, t=D.today();
  const days=[];for(let i=0;i<N;i++)days.push(D.add(S,i));
  const pct=i=>i/N*100;
  const clampBar=(s,e)=>{const i0=Math.max(0,D.diff(S,s)),i1=Math.min(N-1,D.diff(S,e));
    return i1<i0?null:{l:pct(i0),w:pct(i1-i0+1)}};

  const head=days.map((d,i)=>`<div class="dcell ${D.wknd(d)?'wk':''} ${d===t?'tdy':''}" style="left:${pct(i)}%;width:${pct(1)}%">
      <b>${D.p(d).getDate()}</b><span>${D.p(d).toLocaleDateString('en-GB',{weekday:'narrow'})}</span></div>`).join('');

  const rows=sortedPeople().map(p=>{
    const L=laneMap(p.id);
    const h=L.count*23+26;
    const bars=L.list.map(a=>{
      const b=clampBar(a.start,a.end);if(!b)return'';
      const c=prcolor(a.projectId);
      return `<div class="bk" data-a="${a.id}" title="${esc(prname(a.projectId))} · ${D.short(a.start)} → ${D.short(a.end)} · ${D.wdays(a.start,a.end)} working days"
        style="left:${b.l}%;width:${b.w}%;top:${5+L.of[a.id]*23}px;
        background:${c}33;box-shadow:inset 0 0 0 1.5px ${c}AA;color:${c}">
        <span class="gh" data-side="l"></span>
        <span class="bkl">${esc(prname(a.projectId))}</span>
        <span class="gh" data-side="r"></span></div>`}).join('');
    let ghost='';
    if(DRAG&&DRAG.pid===p.id){
      const b=clampBar(DRAG.s<DRAG.e?DRAG.s:DRAG.e, DRAG.s<DRAG.e?DRAG.e:DRAG.s);
      if(b){const gs=DRAG.s<DRAG.e?DRAG.s:DRAG.e,ge=DRAG.s<DRAG.e?DRAG.e:DRAG.s;
        const wd=D.wdays(gs,ge);
        ghost=`<div class="bk ghostbk" style="left:${b.l}%;width:${b.w}%;top:${5+(DRAG.lane||L.count)*23}px">
          ${wd?wd+(wd===1?' day':' days'):'weekend'}</div>`;}
    }
    return `<div class="prow"><div class="pnm">${esc(p.name)}</div>
      <div class="trk" data-p="${p.id}" style="min-height:${h}px">
        ${days.map((d,i)=>`<div class="slot ${D.wknd(d)?'wk':''}" style="left:${pct(i)}%;width:${pct(1)}%"></div>`).join('')}
        ${bars}${ghost}</div></div>`}).join('');

  $('#main').innerHTML=`<div class="glass card">
    <div class="tbar">
      <div class="seg" id="pv"><button data-v="week" aria-selected="${planView==='week'}">Weekly</button>
        <button data-v="month" aria-selected="${planView==='month'}">Monthly</button></div>
      <button class="b s" id="pb">‹</button>
      <span class="dlabel">${planView==='week'
        ?`${D.short(S)} – ${D.short(E)}${D.monday(t)===S?' <b>This week</b>':''}`
        :D.p(S).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span>
      <button class="b s" id="pf">›</button>
      <button class="b s" id="pt">Today</button>
    </div>
    <div class="cal"><div class="calin">
      <div class="prow chead"><div class="pnm">Developer</div><div class="trk hd">${head}</div></div>
      ${rows}
    </div></div>
    <div class="tips">Saturdays and Sundays are non-working — bookings skip them automatically. Drag across a row to book someone. Drag past the edge to carry on into the next week.
      Book the same person again to run projects side by side. Tap a booking to change or remove it.</div>
  </div>`;

  $('#pv').onclick=e=>{const b=e.target.closest('button[data-v]');if(b){planView=b.dataset.v;anchor=null;render()}};
  $('#pb').onclick=()=>shiftPlan(-1);
  $('#pf').onclick=()=>shiftPlan(1);
  $('#pt').onclick=()=>{anchor=null;render()};

  const dateAt=(trk,x)=>{const r=trk.getBoundingClientRect();
    return D.add(S,Math.max(0,Math.min(N-1,Math.floor((x-r.left)/(r.width/N)))))};

  $$('#main .trk[data-p]').forEach(trk=>{
    trk.onpointerdown=ev=>{
      const gh=ev.target.closest('.gh'), bar=ev.target.closest('.bk:not(.ghostbk)');
      ev.preventDefault();
      if(gh&&bar){
        const a=DB.allocs.find(x=>x.id===bar.dataset.a);if(!a)return;
        DRAG={mode:'resize',pid:a.personId,id:a.id,side:gh.dataset.side,
          s:gh.dataset.side==='l'?a.end:a.start,e:dateAt(trk,ev.clientX)};
        return;
      }
      if(bar){DRAG={mode:'tap',id:bar.dataset.a,x:ev.clientX,y:ev.clientY};return}
      const d=dateAt(trk,ev.clientX);
      DRAG={mode:'new',pid:trk.dataset.p,s:d,e:d,x:ev.clientX,y:ev.clientY};
      render();
    };
  });
}

/* drag lives on the document so it survives the view jumping a week */
document.addEventListener('pointermove',ev=>{
  if(!DRAG||DRAG.mode==='tap')return;
  const trk=document.querySelector(`#main .trk[data-p="${DRAG.pid}"]`);
  if(!trk)return;
  const r=trk.getBoundingClientRect(), now=Date.now();
  if(ev.clientX>r.right-14&&now-lastShift>320){lastShift=now;shiftPlan(1);return}
  if(ev.clientX<r.left+14&&now-lastShift>320){lastShift=now;shiftPlan(-1);return}
  const {s:S,e:E}=planRange(), N=D.diff(S,E)+1;
  const i=Math.max(0,Math.min(N-1,Math.floor((ev.clientX-r.left)/(r.width/N))));
  const d=D.add(S,i);
  if(d!==DRAG.e){DRAG.e=d;render()}
});
document.addEventListener('pointercancel',()=>{if(DRAG){DRAG=null;render()}});
document.addEventListener('pointerup',ev=>{
  if(!DRAG)return;const d=DRAG;
  if(d.mode==='tap'){
    DRAG=null;
    const a=DB.allocs.find(x=>x.id===d.id);if(!a)return render();
    pickProject(d.x,d.y,a,v=>{
      if(v==='del')DB.allocs=DB.allocs.filter(x=>x.id!==d.id);
      else if(v){a.projectId=v;mergeSame(a.personId,v)}
      save();render();
    });
    return;
  }
  if(d.mode==='resize'){
    DRAG=null;
    const a=DB.allocs.find(x=>x.id===d.id);
    if(a){let s=d.s<d.e?d.s:d.e, e=d.s<d.e?d.e:d.s;
      s=nextWork(s);e=prevWork(e);
      if(s>e){toast('A booking needs at least one working day',1);}
      else{a.start=s;a.end=e;mergeSame(a.personId,a.projectId)}}
    save();render();return;
  }
  DRAG=null;
  const s=d.s<d.e?d.s:d.e, e=d.s<d.e?d.e:d.s;
  render();
  pickProject(d.x,d.y,null,v=>{if(v)addBooking(d.pid,s,e,v);save();render()});
});

/* ==================== safety net: automatic snapshots ==================== */
const SNAPKEY='devsamosa:snaps';
async function snapRead(){
  try{
    if(STORE.mode==='claude'){const r=await window.storage.get(SNAPKEY,false);return r&&r.value}
    return localStorage.getItem(SNAPKEY);
  }catch(e){return null}
}
async function snapWrite(v){
  try{
    if(STORE.mode==='claude'){await window.storage.set(SNAPKEY,v,false);return true}
    localStorage.setItem(SNAPKEY,v);return true;
  }catch(e){return false}
}
async function snapshots(){
  try{const r=await snapRead();const l=r?JSON.parse(r):[];return Array.isArray(l)?l:[]}catch(e){return[]}
}
async function snapshot(label){
  const list=await snapshots();
  list.unshift({ts:Date.now(),label,
    n:DB.updates.length,b:DB.allocs.length,p:DB.people.length,
    data:JSON.stringify({people:DB.people,projects:DB.projects,updates:DB.updates,
      allocs:DB.allocs,roster:DB.roster||[]})});
  await snapWrite(JSON.stringify(list.slice(0,6)));
}
async function autoSnapshot(){
  if(!DB.updates.length&&!DB.allocs.length)return;
  const list=await snapshots();
  if(list.length&&Date.now()-list[0].ts<12*36e5)return;
  await snapshot('Automatic');
}
const ago=ts=>{
  const m=Math.round((Date.now()-ts)/6e4);
  if(m<1)return'just now';if(m<60)return m+' min ago';
  const h=Math.round(m/60);if(h<24)return h+' hour'+(h>1?'s':'')+' ago';
  const d=Math.round(h/24);return d+' day'+(d>1?'s':'')+' ago';
};

    if(!DB.recovery)return $('#e2').textContent='No secret number is set. Set one from the menu first.';
    if(await hash(k)!==DB.recovery)return $('#e2').textContent='That secret number is not right.';
    await snapshot('Before clearing');
    DB.updates=[];DB.allocs=[];
    save('Cleared — you can undo from Backups');close();render();
  };
  $('#k').onkeydown=e=>{if(e.key==='Enter')$('#ok').click()};
}

let CRITTERS=true;
function buildMenu(){
  const item=(id,label,extra)=>`<button class="mi" data-a="${id}">${label}${extra?`<span class="mx">${extra}</span>`:''}</button>`;
  const sep='<div class="msep"></div>';
  let html=item('imp','Import from Excel')+item('xlall','Download everything (Excel)')
    +item('back','Download backup')+item('restore','Restore from a file')
    +item('snaps','Backups &amp; undo')+sep;
  html+=item('pw','Change password')+item('sec','Secret number')+sep;
  /* on a shared password the repo is never shown, so name the action by what it
     costs you: the team password, rather than a repo you have never seen */
  html+=(STORE.mode==='github'
        ?(GHENC?item('ghout','Forget this device')
               :item('ghout','Disconnect team repo',GH.owner+'/'+GH.repo))
      :STORE.mode==='cloud'?item('cloudout','Sign out of team board',CLOUD.email)
      :item('ghin','Use a shared team board'))+sep;
  html+=item('theme','Appearance',THEME==='dark'?'Dark':'Light')
     +item('wall','Wallpaper',WALLS[wall])
     +item('crit','Critters',CRITTERS?'On':'Off')
     +item('sync','Reload data')+sep;
  html+=item('wipe','Clear all updates')+item('out','Sign out');
  $('#menu').innerHTML=html;
  $$('#menu .mi').forEach(b=>b.onclick=async()=>{
    closeMenu();
    const a=b.dataset.a;
    if(a==='imp')importForm();
    else if(a==='xlall')xlsx(allSheets(),`devsamosa-everything-${D.today()}`);
    else if(a==='back')dl(new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}),`devsamosa-backup-${D.today()}.json`);
    else if(a==='restore'){const f=document.createElement('input');f.type='file';f.accept='.json';
      f.onchange=()=>f.files[0]&&restoreBackup(f.files[0]);f.click()}
    else if(a==='snaps')backupsForm();
    else if(a==='pw')passForm();
    else if(a==='sec')secretForm();
    else if(a==='theme')toggleTheme();
    else if(a==='wall')cycleWall();
    else if(a==='crit'){CRITTERS=!CRITTERS;toast('Critters '+(CRITTERS?'on':'off'));if(!CRITTERS)$$('.critter').forEach(c=>c.remove())}
    else if(a==='sync'){await load();render();toast('Up to date')}
    else if(a==='ghin')ghConnect();
    else if(a==='ghout'){clearInterval(GH.poll);ghForget();ghPinForget();location.reload()}
    else if(a==='cloudin')cloudConnect();
    else if(a==='cloudout'){clearInterval(CLOUD.poll);
      CLOUD.token='';CLOUD.refresh='';CLOUD.exp=0;cloudCfgSave();cloudLock('in')}
    else if(a==='wipe')clearForm();
    else if(a==='out'){
      if(STORE.mode==='cloud'){clearInterval(CLOUD.poll);CLOUD.token='';CLOUD.refresh='';
        CLOUD.exp=0;cloudCfgSave();return cloudLock('in')}
      /* Sign out means lock, not forget: the PIN gets you back in, same as a
         banking app. "Forget this device" is the one that drops the PIN copy
         and makes the team password necessary again. */
      if(STORE.mode==='github'&&GHENC){
        clearInterval(GH.poll);await clearSession();ADMIN=false;
        Object.assign(GH,{token:'',head:'',tree:'',shas:{},last:{}});
        return ghPinBox()?ghPinLock():ghTeamLock();
      }
      await clearSession();ADMIN=false;lockScreen('in')}
  });
}

const PERIODS=[['week','This week'],['lastweek','Last week'],['month','This month'],
  ['quarter','This quarter'],['year','This year'],['all','All time'],['custom','Pick dates']];
function periodRange(){
  const t=D.today(),d=D.p(t),y=d.getFullYear();
  switch(rep.period){
    case 'week':return[D.monday(t),D.add(D.monday(t),6)];
    case 'lastweek':return[D.add(D.monday(t),-7),D.add(D.monday(t),-1)];
    case 'month':return[D.som(t),D.eom(t)];
    case 'quarter':return[D.soq(t),t];
    case 'year':return[`${y}-01-01`,t];
    case 'all':{const ds=DB.updates.map(u=>u.date).sort();return[ds[0]||D.add(t,-30),t]}
    default:return[rep.from||D.add(t,-30),rep.to||t];
  }
}

    <div class="cb">

        <div class="bs"><div class="bsv">${active}<span class="bso">/${DB.people.length}</span></div><div class="bsl">developers active</div></div>
        <div class="bs"><div class="bsv">${projects}</div><div class="bsl">projects worked on</div></div>

      </div>
    </div>

    ${rows.length?`
    <div class="cb secn">
      <div class="secl">How the work is going</div>
      <div class="statbar">${STATUSES.filter(s=>st[s]).map(s=>
        `<div class="stg" style="width:${st[s]/rows.length*100}%;background:${STCOLOR[s]}" title="${STLABEL[s]}: ${st[s]}"></div>`).join('')}</div>

/* ==================== excel import ==================== */
const XI={wb:null,sheet:'',grid:[],hdr:0,dayFirst:true};
const pad2=n=>String(n).padStart(2,'0');

function xlDate(v,dayFirst){
  if(v instanceof Date&&!isNaN(v))return D.iso(new Date(v.getFullYear(),v.getMonth(),v.getDate()));
  if(typeof v==='number'&&v>20000&&v<70000){
    const d=new Date(Math.round((v-25569)*864e5));
    return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth()+1)}-${pad2(d.getUTCDate())}`;
  }
  if(typeof v!=='string')return null;
  const s=v.trim();if(!s)return null;
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m)return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if(m){let a=+m[1],b=+m[2],y=m[3].length===2?'20'+m[3]:m[3];
    let dd,mm;
    if(a>12){dd=a;mm=b}else if(b>12){dd=b;mm=a}else{dd=dayFirst?a:b;mm=dayFirst?b:a}
    if(mm<1||mm>12||dd<1||dd>31)return null;
    return `${y}-${pad2(mm)}-${pad2(dd)}`;}
  m=s.match(/^(\d{1,2})[\s-]([A-Za-z]{3,9})[\s-](\d{2,4})$/);
  if(m){const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec']
    .indexOf(m[2].slice(0,3).toLowerCase());
    if(mi>=0)return `${m[3].length===2?'20'+m[3]:m[3]}-${pad2(mi+1)}-${pad2(+m[1])}`}
  const d=new Date(s);
  if(!isNaN(d)&&d.getFullYear()>2000&&d.getFullYear()<2100)return D.iso(d);
  return null;
}
function xlHours(v){
  if(v==null||v==='')return 0;
  if(typeof v==='number')return Math.round(v*10)/10;
  const s=String(v).toLowerCase();
  const m=s.match(/(\d+(?:\.\d+)?)/);if(!m)return 0;
  let n=parseFloat(m[1]);
  if(/\bd\b|day/.test(s))n*=8;
  if(/\bw\b|week/.test(s))n*=40;
  if(/\bm\b|min/.test(s)&&!/month/.test(s))n/=60;
  return Math.round(n*10)/10;
}
function xlStatus(v,date){
  const s=String(v||'').toLowerCase().trim();
  if(STATUSES.includes(s))return s;
  if(/block|hold|stuck|wait|depend/.test(s))return 'blocked';
  if(/done|complete|closed|finish|deliver|ship|merged|yes/.test(s))return 'done';
  if(/plan|todo|to do|not started|backlog|upcoming/.test(s))return 'planned';
  if(/progress|wip|ongoing|started|working/.test(s))return 'progress';
  return date&&date<D.today()?'done':'progress';
}
const HINTS={
  date:/date|day\b|dt\b|when/i,
  person:/name|person|develop|resource|assign|member|owner|employee|engineer|team ?member/i,
  project:/project|module|product|epic|client|stream|feature area/i,
  task:/task|work|update|descr|activity|summary|item|comment|detail|remark/i,
  est:/est|hour|hrs|hrs\.|effort|time|days?\b|duration|point/i,
  status:/status|state|progress|stage/i
};
function guessCol(headers,kind){
  const i=headers.findIndex(h=>HINTS[kind].test(String(h||'')));
  return i;
}
function findHeaderRow(grid){
  for(let i=0;i<Math.min(12,grid.length);i++){
    const filled=grid[i].filter(c=>String(c||'').trim()).length;
    if(filled>=2&&grid[i].some(c=>/name|date|task|project|develop|status/i.test(String(c||''))))return i;
  }
  for(let i=0;i<Math.min(12,grid.length);i++)
    if(grid[i].filter(c=>String(c||'').trim()).length>=2)return i;
  return 0;
}

    <div class="row" style="margin-top:16px"><button class="b p" id="ok">Preview import</button>
      <button class="b" id="back">Choose another file</button><button class="b" id="cx">Cancel</button></div></div>`);

  $('#cx').onclick=close;$('#back').onclick=importForm;
  $('#msheet').onchange=e=>{XI.sheet=e.target.value;mapForm()};
  $('#mhdr').onchange=e=>{XI.hdr=+e.target.value;const h=(XI.grid[XI.hdr]||[]).map(x=>String(x||'').trim());mapForm()};
  $('#mdf').onchange=e=>{XI.dayFirst=e.target.value==='1'};
  $('#mlay').onclick=e=>{const b=e.target.closest('button[data-w]');if(!b)return;
    $$('#mlay button').forEach(x=>x.setAttribute('aria-selected',x===b));
    $('#mlong').classList.toggle('hidden',b.dataset.w==='1');
    $('#mwide').classList.toggle('hidden',b.dataset.w!=='1')};
  $('#ok').onclick=()=>{
    const isWide=$('#mlay button[data-w="1"]').getAttribute('aria-selected')==='true';
    const from=$('#mfrom').value||'0000-01-01';
    const rows=isWide?readWide(from):readLong(from);
    if(!rows.length)return toast('Nothing found in that range — check the mapping',1);
    importPreview(rows,from);
  };
}
function readLong(from){
  const c={D:+$('#cD').value,N:+$('#cN').value,T:+$('#cT').value,
    P:+$('#cP').value,E:+$('#cE').value,S:+$('#cS').value};
  const out=[];let lastName='';
  for(let i=XI.hdr+1;i<XI.grid.length;i++){
    const r=XI.grid[i];if(!r)continue;
    const date=xlDate(r[c.D],XI.dayFirst);
    let name=String(r[c.N]??'').trim();
    if(!name)name=lastName;else lastName=name;
    const task=String(r[c.T]??'').trim();
    if(!date||!name||!task)continue;
    if(date<from)continue;
    out.push({date,name,project:c.P>=0?String(r[c.P]??'').trim():'',task,
      est:c.E>=0?xlHours(r[c.E]):0,status:xlStatus(c.S>=0?r[c.S]:'',date)});
  }
  return out;
}
function readWide(from){
  const nCol=+$('#wN').value,pCol=+$('#wP').value;
  const hdrs=XI.grid[XI.hdr]||[];
  const cols=hdrs.map((h,i)=>({i,d:xlDate(h,XI.dayFirst)})).filter(x=>x.d&&x.i!==nCol);
  const out=[];let lastName='',lastProj='';
  for(let i=XI.hdr+1;i<XI.grid.length;i++){
    const r=XI.grid[i];if(!r)continue;
    let name=String(r[nCol]??'').trim();
    if(!name)name=lastName;else lastName=name;
    if(!name)continue;
    let proj=pCol>=0?String(r[pCol]??'').trim():'';
    if(pCol>=0){if(!proj)proj=lastProj;else lastProj=proj}
    for(const c of cols){
      const task=String(r[c.i]??'').trim();
      if(!task||task==='-'||task==='—')continue;
      if(c.d<from)continue;
      out.push({date:c.d,name,project:proj,task,est:0,status:xlStatus('',c.d)});
    }
  }
  return out;
}
function importPreview(rows,from){
  const newPeople=new Set(),newProj=new Set();
  let dupes=0;
  const clean=[];
  rows.forEach(r=>{
    const pid=matchPerson(r.name);
    if(!pid)newPeople.add(r.name);
    if(r.project&&!matchProject(r.project))newProj.add(r.project);
    const dup=DB.updates.some(u=>u.date===r.date&&pname(u.personId).toLowerCase()===r.name.toLowerCase()
      &&u.task.trim().toLowerCase()===r.task.trim().toLowerCase());
    if(dup){dupes++;return}
    clean.push(r);
  });
  const dates=clean.map(r=>r.date).sort();
  const sample=clean.slice(0,8).map(r=>`<tr><td>${D.short(r.date)}</td><td>${esc(r.name)}
    ${matchPerson(r.name)?'':'<span class="lbl" style="color:var(--accent)"> new</span>'}</td>
    <td>${esc(r.project||'—')}</td><td>${esc(r.task.slice(0,54))}</td>
    <td class="n">${r.est||'–'}</td><td>${r.status}</td></tr>`).join('');
  modal(`<div class="ch"><h2>Ready to import</h2><span class="sub">${clean.length} rows</span></div>
    <div class="cb" style="padding-bottom:6px">
      <div class="kpis" style="margin-bottom:14px">
        <div class="kpi"><div class="lbl">Updates</div><div class="v" style="color:var(--blue)">${clean.length}</div></div>
        <div class="kpi"><div class="lbl">New people</div><div class="v" style="color:${newPeople.size?'var(--accent)':'var(--txt3)'}">${newPeople.size}</div></div>
        <div class="kpi"><div class="lbl">New projects</div><div class="v" style="color:${newProj.size?'var(--accent)':'var(--txt3)'}">${newProj.size}</div></div>
        <div class="kpi"><div class="lbl">Skipped as duplicates</div><div class="v" style="color:var(--txt3)">${dupes}</div></div>
      </div>
      <p class="hint" style="margin:0">${dates.length?`Covering ${D.long(dates[0])} to ${D.long(dates[dates.length-1])}.`:''}
      ${newPeople.size?`<br>Will be created: <b>${esc([...newPeople].slice(0,8).join(', '))}</b>${newPeople.size>8?` and ${newPeople.size-8} more`:''}. Rename or merge them afterwards in the Team tab.`:''}</p>
    </div>
    <div class="scrollx"><table class="rev"><thead><tr><th>Date</th><th>Person</th><th>Project</th><th>Task</th><th class="n">Est</th><th>Status</th></tr></thead>
      <tbody>${sample}</tbody></table></div>
    ${clean.length>8?`<div class="cb" style="padding-top:8px;padding-bottom:0"><p class="hint" style="margin:0">First 8 of ${clean.length} shown.</p></div>`:''}
    <div class="cb"><div class="row"><button class="b p" id="ok">Import ${clean.length} updates</button>
      <button class="b" id="back">Back to mapping</button><button class="b" id="cx">Cancel</button></div></div>`);
  $('#cx').onclick=close;$('#back').onclick=mapForm;
  $('#ok').onclick=()=>{
    let n=0;
    clean.forEach(r=>{
      let pid=matchPerson(r.name);
      if(!pid){const p={id:uid(),name:r.name,role:''};DB.people.push(p);pid=p.id}
      let prid=r.project?matchProject(r.project):'';
      if(r.project&&!prid){const pr={id:uid(),name:r.project,color:PAL[DB.projects.length%PAL.length]};
        DB.projects.push(pr);prid=pr.id}
      if(!prid)prid=(DB.projects[0]||{}).id||'';
      DB.updates.push({id:uid(),date:r.date,personId:pid,projectId:prid,task:r.task,
        est:+r.est||0,spent:0,status:r.status});n++;
    });
    save();close();
    view='reports';rep.period='custom';rep.from=from;rep.to=D.today();
    render();toast(`Imported ${n} updates`);
  };
}

const SEED={"people":[],"projects":[],"updates":[]};
/* merge the pre-loaded standup data, skipping anything already present */
function mergeSeed(){
  const pm={},jm={};let np=0,nj=0,nu=0;
  SEED.people.forEach(p=>{
    let ex=DB.people.find(x=>x.name.trim().toLowerCase()===p.name.trim().toLowerCase());
    if(!ex){ex={id:uid(),name:p.name,role:p.role||''};DB.people.push(ex);np++}
    pm[p.id]=ex.id;
  });
  SEED.projects.forEach(j=>{
    let ex=DB.projects.find(x=>x.name.trim().toLowerCase()===j.name.trim().toLowerCase());
    if(!ex){ex={id:uid(),name:j.name,color:j.color};DB.projects.push(ex);nj++}
    jm[j.id]=ex.id;
  });
  return{np,nj,nu};
}

    DB.allocs.push({id:uid(),personId:p.id,projectId:DB.projects[i%DB.projects.length].id,start:s1,end:e1,pct:100,note:''});
    if(i%3===0){const s2=D.add(e1,4+(i%9));

  });
}

/* ==================== boot ==================== */
(async()=>{
  THEME=matchMedia('(prefers-color-scheme:light)').matches?'light':'dark';
  document.documentElement.dataset.t=THEME;
  try{bgInit()}catch(e){console.error('background',e)}
  try{
    /* this device has already been set up: PIN only, no passphrase */
    if(GHENC&&ghPinBox()){
      STORE.mode='github';STORE.label='Team repo';
      ghPinLock();
      return;
    }
    if(ghCfgLoad()){
      STORE.mode='github';STORE.label='Team repo';
      await ghStart();
      return;
    }
    /* a shared password is baked in: ask for that and nothing else */
    if(GHENC){
      STORE.mode='github';STORE.label='Team repo';
      ghTeamLock();
      return;
    }
    if(cloudCfgLoad()){
      STORE.mode='cloud';STORE.label='Team database';
      if(CLOUD.token&&(await sbRefresh()||Date.now()<CLOUD.exp))await cloudStart(false);
      else cloudLock('in');
      return;
    }
    await initStore();
    await load();
    const s=await getSession();
    if(s&&DB.pass&&s.role==='admin'){ADMIN=true;enter()}
    /* nothing stored and no board yet — almost always someone opening the hosted
       URL for the first time, so offer the team board rather than a local-only
       login they'd have to undo. "Use this device only" is right there on it. */
    else if(!DB.pass&&/^(local|memory)$/.test(STORE.mode))ghConnect();
    else lockScreen();
  }catch(e){
    console.error(e);
    document.getElementById('lock').classList.remove('hidden');
    document.getElementById('lock').innerHTML=
      '<div class="lockcard"><h1>Something went wrong</h1>'+
      '<p class="tag">The app could not start. Your saved data is untouched.</p>'+
      '<p class="lockerr">'+String(e&&e.message||e)+'</p>'+
      '<button class="b p" style="width:100%;justify-content:center;padding:12px" '+
      'onclick="location.reload()">Reload</button></div>';
  }
})();
