<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DevSamosa">
<meta name="mobile-web-app-capable" content="yes">
<title>DevSamosa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
:root{
  --blue:#0A84FF; --saffron:#FF9F0A; --green:#30D158; --red:#FF453A; --grey:#8E8E93;
  --purple:#BF5AF2; --teal:#40C8E0; --pink:#FF375F; --indigo:#5E5CE6;
  --accent:#FF9F0A;
  --r:22px; --r2:14px; --r3:10px;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Inter',system-ui,'Segoe UI',sans-serif;
  --blur:saturate(180%) blur(30px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
:root[data-t="dark"]{
  color-scheme:dark;
  --bg:#0A0A0E; --glass:rgba(32,32,38,.52); --glass2:rgba(58,58,66,.42); --glassh:rgba(72,72,82,.5);
  /* sticky headers and the frozen name column must hide what scrolls under them.
     Android Chrome supports backdrop-filter but does not always composite it
     (battery saver, GPU rasterisation off), and then a .52 surface is see-through. */
  --glassS:rgba(24,24,30,.95);
  --stroke:rgba(255,255,255,.11); --spec:rgba(255,255,255,.16); --hair:rgba(255,255,255,.075);
  --txt:#F2F2F7; --txt2:rgba(235,235,245,.62); --txt3:rgba(235,235,245,.34);
  --fill:rgba(120,120,128,.26); --fill2:rgba(120,120,128,.38); --field:rgba(0,0,0,.26);
  --optbg:#2A2A30;
  --shadow:0 12px 44px rgba(0,0,0,.55);
}
:root[data-t="light"]{
  color-scheme:light;
  --bg:#E9E9EF; --glass:rgba(255,255,255,.86); --glass2:rgba(255,255,255,.72); --glassh:rgba(255,255,255,.97);
  --glassS:rgba(250,250,253,.96);
  --stroke:rgba(255,255,255,.9); --spec:rgba(255,255,255,1); --hair:rgba(60,60,67,.2);
  --txt:#0B0B0D; --txt2:rgba(45,45,52,.82); --txt3:rgba(45,45,52,.58);
  --fill:rgba(120,120,128,.15); --fill2:rgba(120,120,128,.24); --field:rgba(255,255,255,.6);
  --optbg:#FFFFFF;
  --shadow:0 12px 40px rgba(60,60,90,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.45;
  min-height:100vh;overflow-x:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:2;max-width:1400px;margin:0 auto;padding:0 16px calc(112px + var(--safe-b))}
@media(min-width:861px){#app{padding-bottom:56px}}

/* ---------------- glass primitives ---------------- */
.glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:var(--r);box-shadow:var(--shadow);position:relative;overflow:hidden}
.glass::before{content:"";position:absolute;top:0;left:14px;right:14px;height:1px;
  background:linear-gradient(90deg,transparent,var(--spec),transparent);pointer-events:none;z-index:1}
.card{margin-bottom:16px}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--hair);flex-wrap:wrap}
.ch h2{margin:0;font-size:16px;font-weight:600;letter-spacing:-.02em}
.cb{padding:16px}
.sp{margin-left:auto}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txt3)}
.sub{font-size:13px;color:var(--txt2)}
.grid2{display:grid;grid-template-columns:1fr 336px;gap:16px;align-items:start}
@media(max-width:1100px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}

/* ---------------- controls ---------------- */
/* ---------- iOS buttons ---------- */
button.b,a.b{
  font-family:var(--sans);font-size:14px;font-weight:590;letter-spacing:-.012em;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:34px;padding:0 16px;border-radius:980px;cursor:pointer;text-decoration:none;
  background:var(--glass2);color:var(--txt);border:.5px solid var(--stroke);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 1px 2px rgba(0,0,0,.16),inset 0 .5px 0 var(--spec);
  transition:transform .16s cubic-bezier(.2,.9,.3,1),background .2s,box-shadow .2s,opacity .2s;
  white-space:nowrap;-webkit-user-select:none;user-select:none;
}
button.b:hover,a.b:hover{background:var(--glassh)}
button.b:active,a.b:active{transform:scale(.94);box-shadow:0 0 0 rgba(0,0,0,0)}
button.b:disabled{opacity:.35;cursor:not-allowed;transform:none}

/* filled — the one primary action */
button.b.p{background:var(--blue);color:#fff;border-color:transparent;
  box-shadow:0 2px 10px rgba(10,132,255,.36),inset 0 .5px 0 rgba(255,255,255,.34)}
button.b.p:hover{background:#3D9BFF}
button.b.p:active{background:#0A6FD8}

/* tinted — secondary emphasis */
button.b.w{background:rgba(255,159,10,.17);color:var(--saffron);border-color:transparent;box-shadow:none}
button.b.w:hover{background:rgba(255,159,10,.26)}
button.b.d{background:rgba(255,69,58,.15);color:var(--red);border-color:transparent;box-shadow:none}
button.b.d:hover{background:rgba(255,69,58,.24)}

/* plain — quiet, no chrome until touched */
button.b.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--blue)}
button.b.ghost:hover{background:var(--fill)}

button.b.s{min-height:29px;padding:0 12px;font-size:13px;border-radius:980px}
@media(max-width:860px){button.b{min-height:40px;padding:0 18px}button.b.s{min-height:34px;padding:0 14px}}

/* circular icon buttons */
button.i{background:none;border:0;color:var(--txt3);cursor:pointer;width:26px;height:26px;
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;
  border-radius:50%;transition:background .16s,color .16s,transform .16s}
button.i:hover{color:var(--red);background:rgba(255,69,58,.13)}
button.i:active{transform:scale(.88)}
button.i.e:hover{color:var(--blue);background:rgba(10,132,255,.13)}

/* iOS segmented control */
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:0;
  box-shadow:inset 0 .5px 1px rgba(0,0,0,.14)}
.seg button{flex:1;background:none;border:0;color:var(--txt);font-family:var(--sans);font-size:13px;
  font-weight:500;letter-spacing:-.01em;padding:6px 14px;border-radius:8px;cursor:pointer;
  white-space:nowrap;transition:background .22s cubic-bezier(.2,.9,.3,1),box-shadow .22s;
  position:relative}
.seg button+button::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:.5px;
  background:var(--hair)}
.seg button[aria-selected="true"]{background:var(--glassh);font-weight:590;
  box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.04)}
.seg button[aria-selected="true"]::before,.seg button[aria-selected="true"]+button::before{opacity:0}
.seg button:active{transform:scale(.96)}

select option{background:var(--optbg);color:var(--txt);font-weight:500;padding:6px}
input,select,textarea{font-family:var(--sans);font-size:15px;background:var(--field);color:var(--txt);
  border:1px solid var(--hair);border-radius:var(--r3);padding:9px 11px;outline:none;width:100%;
  appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--txt3) 50%),linear-gradient(135deg,var(--txt3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px,5px 5px;
  background-repeat:no-repeat;padding-right:30px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(10,132,255,.18)}
input::placeholder,textarea::placeholder{color:var(--txt3)}
label.f{display:block}
label.f .lbl{margin-bottom:6px;display:block}
.seg{display:inline-flex;background:var(--fill);border-radius:11px;padding:2px;gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--txt2);font-family:var(--sans);font-size:13px;
  font-weight:500;padding:6px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;transition:.15s}
.seg button[aria-selected="true"]{background:var(--glassh);color:var(--txt);box-shadow:0 1px 3px rgba(0,0,0,.18)}

/* ---------------- header ---------------- */
header{display:flex;align-items:center;gap:12px;padding:22px 0 14px;flex-wrap:wrap}
.mark{width:38px;height:38px;flex:0 0 auto;filter:drop-shadow(0 3px 10px rgba(255,159,10,.45))}
.brand h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.035em}
.brand p{margin:0;font-size:12px;color:var(--txt2)}
.hbtns{margin-left:auto;display:flex;gap:7px;align-items:center}
.me{display:flex;align-items:center;gap:8px;background:var(--glass2);border:1px solid var(--stroke);
  border-radius:980px;padding:4px 12px 4px 4px;backdrop-filter:blur(12px)}
.ticker{display:flex;gap:9px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
.ticker::-webkit-scrollbar{display:none}
.stat{flex:0 0 auto;min-width:112px;padding:11px 14px;background:var(--glass);border:1px solid var(--stroke);
  border-radius:16px;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}
.stat .v{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.2}

/* desktop nav */
nav.top{display:flex;margin-bottom:16px}
nav.top .seg{width:100%}
@media(max-width:860px){nav.top{display:none}}
/* mobile tab bar */
nav.tabs{display:none;position:fixed;left:10px;right:10px;bottom:calc(10px + var(--safe-b));z-index:40;
  background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke);border-radius:24px;box-shadow:var(--shadow);padding:7px 5px}
@media(max-width:860px){nav.tabs{display:flex}}
nav.tabs button{flex:1;background:none;border:0;color:var(--txt3);cursor:pointer;padding:5px 2px;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--sans);font-size:10px;font-weight:500}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--blue)}

/* ---------------- tables ---------------- */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txt3);
  text-align:left;padding:10px 14px;border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--hair);vertical-align:middle;font-size:14px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--fill)}
td.n,th.n{text-align:right;white-space:nowrap}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;
  padding:4px 9px;border-radius:980px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.st{font-size:12px;font-weight:500;padding:3px 9px;border-radius:980px;white-space:nowrap}
.st.planned{background:rgba(64,200,224,.16);color:var(--grey)}
.st.progress{background:rgba(10,132,255,.18);color:var(--blue)}
.st.blocked{background:rgba(255,59,48,.16);color:var(--red)}
.st.done{background:rgba(52,199,89,.16);color:var(--green)}
.av{width:30px;height:30px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  font-size:11.5px;font-weight:700;color:#fff;letter-spacing:-.02em}
.nm{display:flex;align-items:center;gap:9px;flex-wrap:nowrap}
/* stacked cards on phones */
@media(max-width:720px){
  table.resp thead{display:none}
  table.resp tbody tr{display:block;padding:12px 14px;border-bottom:1px solid var(--hair)}
  table.resp tbody tr:hover{background:none}
  table.resp td{display:flex;justify-content:space-between;gap:14px;padding:3px 0;border:0;text-align:right}
  table.resp td::before{content:attr(data-l);color:var(--txt3);font-size:11px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;text-align:left;flex:0 0 auto;padding-top:2px}
  table.resp td.full{display:block;text-align:left;padding:5px 0 7px}
  table.resp td.full::before{display:block;margin-bottom:3px}
  table.resp tfoot{display:none}

  /* Today is the screen you actually type on, so it gets a tighter card than the
     generic restack: name and status share a line, the task runs full width, and
     project sits next to the row actions. One field per labelled line made every
     developer 241px tall — nearly six screens for eighteen of them. */
  table.resp.gt tbody tr{display:flex;flex-wrap:wrap;align-items:center;
    gap:7px 10px;padding:10px 13px}
  table.resp.gt td{display:block;padding:0;border:0;text-align:left}
  table.resp.gt td::before{display:none}
  table.resp.gt td.pcell{order:1;flex:1 1 auto;min-width:0}
  table.resp.gt td[data-l="Status"]{order:2;flex:0 0 auto}
  table.resp.gt td.tcell{order:3;flex:1 0 100%;padding:0}
  table.resp.gt td[data-l="Project"]{order:4;flex:1 1 auto;min-width:0}
  table.resp.gt td[data-l="Hours"]{order:5;flex:0 0 auto}
  table.resp.gt td.acts{order:6;flex:0 0 auto;display:flex;
    justify-content:flex-end;gap:2px;margin-left:auto}
  table.resp.gt .nm{gap:8px}
  table.resp.gt select.c-pr{width:100%;min-width:0}
  /* it reveals on hover, which never happens on touch — so it was an invisible
     but still tappable "remove developer" sitting beside every name. Removing
     people belongs on Team & Projects; keep it off the typing screen. */
  table.resp.gt .pcell .rmdev{display:none}
}

/* thumb-sized controls on touch layouts; the desktop keeps its compact sizing */
@media(max-width:720px){
  .seg button{min-height:44px}
  #app table.resp td button.i,#app button.i.delp{width:34px;height:34px}
  #app table.resp.gt td.acts button.i{width:40px;height:40px;font-size:14px}
}
.empty{text-align:center;padding:44px 22px;color:var(--txt2)}
.empty h3{margin:0 0 6px;font-size:17px;font-weight:600;color:var(--txt)}
.empty p{margin:0 auto 18px;max-width:380px;font-size:14px}

/* ---------------- capacity ribbon ---------------- */
.ribbon{overflow-x:auto;-webkit-overflow-scrolling:touch}
.rbi{min-width:780px}
.rbh{display:flex;position:sticky;top:0;z-index:3;background:var(--glassS);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--hair)}
.rbn{width:158px;flex:0 0 158px;padding:9px 14px;border-right:1px solid var(--hair);
  display:flex;flex-direction:column;justify-content:center;gap:1px}
@media(max-width:720px){.rbn{width:118px;flex:0 0 118px;padding:9px 10px}}
.rbt{flex:1;position:relative;height:36px}
.mk{position:absolute;top:0;bottom:0;border-left:1px solid var(--hair)}
.mk span{position:absolute;top:9px;left:6px;font-size:10px;font-weight:600;color:var(--txt3);white-space:nowrap}
.mk.m1{border-left-color:var(--txt3)}
.mk.m1 span{color:var(--txt2)}
.rr{display:flex;border-bottom:1px solid var(--hair)}
.rr:last-child{border-bottom:0}
.rr .rbt{height:auto;min-height:58px}
.who{font-size:14px;font-weight:500;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{position:absolute;height:21px;border-radius:980px;display:flex;align-items:center;padding:0 9px;
  font-size:11px;font-weight:600;overflow:hidden;white-space:nowrap;border:1px solid;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:transform .14s}
.bar:hover{transform:scaleY(1.14);z-index:5}
.bar.free{background:linear-gradient(90deg,rgba(255,159,10,.34),rgba(255,159,10,.14));
  border:1px dashed rgba(255,159,10,.85);color:var(--accent);
  box-shadow:0 0 22px -3px rgba(255,159,10,.75),inset 0 1px 0 rgba(255,255,255,.25)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--txt2)}
.legend i{display:inline-block;width:18px;height:10px;border-radius:980px;margin-right:6px;vertical-align:-1px}
.fr{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--hair)}
.fr:last-child{border-bottom:0}
.fr .when{margin-left:auto;text-align:right;font-size:13px;font-weight:600;color:var(--accent);white-space:nowrap}
.fr .when small{display:block;font-size:11px;font-weight:500;color:var(--txt3)}

/* ---------------- report bars ---------------- */
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:minmax(90px,148px) 1fr 88px;gap:12px;align-items:center}
.btr{height:24px;background:var(--fill);border-radius:980px;overflow:hidden}
.bfl{height:100%;border-radius:980px;transition:width .55s cubic-bezier(.2,.85,.25,1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(126px,1fr));gap:11px}
.kpi{padding:14px 16px;border:1px solid var(--hair);border-radius:16px;background:var(--fill)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.035em;line-height:1.15;margin-top:2px}

/* ---------------- sheet / modal ---------------- */
#modal{position:fixed;inset:0;z-index:70;display:grid;place-items:center;padding:20px;
  background:rgba(0,0,0,.42);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#modal .sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--glass);
  backdrop-filter:saturate(180%) blur(40px);-webkit-backdrop-filter:saturate(180%) blur(40px);
  border:1px solid var(--stroke);border-radius:26px;box-shadow:var(--shadow);animation:pop .28s cubic-bezier(.2,.9,.25,1)}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(14px)}}
.grab{display:none}
@media(max-width:640px){
  #modal{place-items:end;padding:0}
  #modal .sheet{max-width:none;border-radius:26px 26px 0 0;max-height:92vh;
    padding-bottom:var(--safe-b);animation:up .3s cubic-bezier(.2,.9,.25,1)}
  .grab{display:block;width:38px;height:5px;border-radius:3px;background:var(--txt3);margin:9px auto 0}
}
@keyframes up{from{transform:translateY(100%)}}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.fgrid{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--txt2);margin:8px 0 0;line-height:1.45}
.hidden{display:none!important}

/* ---------------- lock screen ---------------- */
#lock{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:22px}
.lockcard.wide2{max-width:440px}
.lockcard{width:100%;max-width:380px;background:var(--glass);backdrop-filter:saturate(180%) blur(44px);
  -webkit-backdrop-filter:saturate(180%) blur(44px);border:1px solid var(--stroke);border-radius:30px;
  box-shadow:var(--shadow);padding:34px 28px 28px;text-align:center;animation:pop .4s cubic-bezier(.2,.9,.25,1)}
.lockcard .mark{width:62px;height:62px;margin:0 auto 16px}
.lockcard h1{margin:0 0 4px;font-size:27px;font-weight:700;letter-spacing:-.04em}
.lockcard a{color:var(--blue);text-decoration:none}
.lockcard p.tag{margin:0 0 24px;font-size:14px;color:var(--txt2)}
.lockcard label.f{text-align:left;margin-bottom:13px}
#pass{text-align:center;font-size:22px;letter-spacing:.34em;padding:13px;font-weight:600}
#pass::placeholder{letter-spacing:.1em;font-size:15px;font-weight:400}
.orline{display:flex;align-items:center;gap:11px;margin:18px 0 4px;color:var(--txt3);font-size:12px}
.orline::before,.orline::after{content:"";flex:1;height:1px;background:var(--hair)}
.pwwrap{position:relative;display:block}
.pwwrap input{padding-right:64px}
.pweye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;
  cursor:pointer;font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--blue);
  padding:6px 9px;border-radius:8px}
.pweye:hover{background:var(--fill)}
.lockerr{color:var(--red);font-size:13px;min-height:19px;margin:9px 0 0;font-weight:500}
.shake{animation:sh .42s}
@keyframes sh{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* opacity does the hiding, not the slide: translating 150% only moves it by its
   own height, which left the pill (and its last message) parked over the table */
#toast{position:fixed;bottom:calc(88px + var(--safe-b));left:50%;transform:translate(-50%,150%);z-index:99;
  opacity:0;pointer-events:none;
  background:var(--glass);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);
  border:1px solid var(--stroke);border-radius:980px;padding:11px 20px;font-size:14px;font-weight:500;
  transition:transform .34s cubic-bezier(.2,.9,.3,1),opacity .22s ease;
  box-shadow:var(--shadow);max-width:88vw;text-align:center}
@media(min-width:861px){#toast{bottom:26px}}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast.err{color:var(--red)}
.skel{height:14px;border-radius:7px;background:var(--fill);margin:11px 0;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.45}}
/* ---- dots menu ---- */
.menu.mini{top:auto;width:auto;min-width:186px}
.menu{position:fixed;top:56px;right:18px;z-index:80;width:236px;padding:6px;
  background:var(--glass);backdrop-filter:saturate(180%) blur(34px);-webkit-backdrop-filter:saturate(180%) blur(34px);
  border:.5px solid var(--stroke);border-radius:15px;box-shadow:var(--shadow);
  animation:mpop .16s cubic-bezier(.2,.9,.3,1)}
@keyframes mpop{from{opacity:0;transform:scale(.94) translateY(-6px)}}
.mi{display:flex;align-items:center;width:100%;background:none;border:0;cursor:pointer;
  font-family:var(--sans);font-size:14px;font-weight:450;color:var(--txt);
  padding:9px 11px;border-radius:9px;text-align:left}
.mi:hover{background:var(--fill)}
.mi:active{background:var(--fill2)}
.mx{margin-left:auto;color:var(--txt3);font-size:13px}
.msep{height:.5px;background:var(--hair);margin:5px 9px}
#dots{font-size:15px;letter-spacing:.5px;padding:0 13px}
.wide{width:100%;justify-content:center;min-height:44px}

/* ---- booking calendar ---- */
.cal{padding:0 0 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.calin{padding:0 12px 4px;min-width:640px}
.prow{display:flex;align-items:stretch;border-bottom:.5px solid var(--hair)}
.prow:last-child{border-bottom:0}
.chead{position:sticky;top:0;z-index:3;background:var(--glassS);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.pnm{width:132px;flex:0 0 132px;padding:9px 10px;font-size:13.5px;font-weight:500;
  display:flex;align-items:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  position:sticky;left:0;z-index:2;background:var(--glassS);backdrop-filter:blur(20px)}
.chead .pnm{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--txt3)}
.trk{position:relative;flex:1;min-height:44px;touch-action:none;cursor:crosshair}
.trk.hd{min-height:40px}
.slot{position:absolute;top:0;bottom:0;border-left:.5px solid var(--hair);pointer-events:none}
.slot.wk{background:repeating-linear-gradient(45deg,transparent,transparent 4px,
  var(--fill) 4px,var(--fill) 8px);opacity:.85}
.dcell.wk b,.dcell.wk span{opacity:.45}
.dcell{position:absolute;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:1px;border-left:.5px solid var(--hair)}
.dcell b{font-size:12.5px;font-weight:600}
.dcell span{font-size:9.5px;color:var(--txt3);text-transform:uppercase}
.dcell.wk b{color:var(--txt3);font-weight:500}
.dcell.tdy{background:rgba(255,159,10,.13);border-radius:8px}
.dcell.tdy b{color:var(--saffron);font-weight:700}
.dcell.tdy span{color:var(--saffron);opacity:.75}
.dcell.tdy::after{content:"";position:absolute;left:22%;right:22%;bottom:5px;height:2px;
  border-radius:2px;background:var(--saffron)}
.bk{position:absolute;height:19px;border-radius:7px;display:flex;align-items:center;
  font-size:11px;font-weight:600;overflow:hidden;cursor:grab;user-select:none;
  transition:filter .12s}
.bk:hover{filter:brightness(1.2)}
.bkl{flex:1;padding:0 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.gh{width:10px;align-self:stretch;cursor:ew-resize;flex:0 0 auto;position:relative}
.gh::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:2px;height:12px;border-radius:2px;background:currentColor;opacity:.45}
.bk:hover .gh::after{opacity:.9}
.ghostbk{background:rgba(10,132,255,.2);box-shadow:inset 0 0 0 1.5px var(--blue);color:var(--blue);
  justify-content:center;pointer-events:none;z-index:5}
.prow{align-items:stretch}
.pnm{align-self:stretch}

/* ---- project picker ---- */
.pick{position:fixed;z-index:85;width:206px;padding:6px;border-radius:15px}
.pkh{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--txt3);padding:7px 10px 5px}
.pki{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;cursor:pointer;
  font-family:var(--sans);font-size:14px;color:var(--txt);padding:8px 10px;border-radius:9px;text-align:left}
.pki:hover{background:var(--fill)}
.pki.del{color:var(--red)}

/* ---- critters ---- */
.critter{color:var(--saffron);pointer-events:none}
.critter svg{width:100%;height:100%;display:block}
.peek{position:absolute;top:-13px;left:14px;width:30px;height:18px;overflow:hidden;
  transform:translateY(16px);opacity:0;transition:transform .32s cubic-bezier(.2,1.5,.4,1),opacity .22s;z-index:4}
.peek.up{transform:translateY(0);opacity:.85}
.tcell{position:relative}
.fly{position:fixed;left:-70px;width:34px;height:20px;z-index:1;opacity:.5;
  animation:flyx 9s linear forwards}
@keyframes flyx{to{left:calc(100vw + 70px)}}
.fly .w1{transform-origin:20px 12px;animation:flap .42s ease-in-out infinite alternate}
.fly .w2{transform-origin:20px 12px;animation:flap .42s ease-in-out infinite alternate-reverse}
@keyframes flap{from{transform:rotate(-14deg) scaleY(.7)}to{transform:rotate(12deg) scaleY(1)}}
@media (prefers-reduced-motion:reduce){.critter{display:none}}

select.c-role,select.c-av{font-size:13px;padding:5px 26px 5px 9px;background-color:var(--fill);
  border-color:transparent;border-radius:8px}
select.c-av{font-weight:600;text-align-last:left}
select.c-av.av-free{background-color:rgba(52,199,89,.16);color:var(--green)}
select.c-av.av-busy{background-color:rgba(120,120,128,.22);color:var(--txt2)}

/* ================= phones & tablets ================= */
/* iOS zooms the page when a focused field is under 16px — never let that happen */
@media (max-width:860px){
  input,select,textarea,.gt input,.gt select,.dense input,.dense select,
  .dense .tcell textarea,.tcell textarea{font-size:16px!important}
  .sheet td,.dense td{padding:6px 12px}
}
/* taps shouldn't wait for a double-tap-to-zoom test */
button,.chip,.cday,.mi,.pki,.bk,.seg button{touch-action:manipulation}
/* the plan grid drags sideways but the page must still scroll up and down */
.trk{touch-action:pan-y}
.cal,.scrollx,.calin{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}

@media (max-width:720px){
  #app{padding:0 12px calc(104px + var(--safe-b))}
  header{padding:10px 0 8px;gap:9px}
  .glass{border-radius:18px}
  .tbar{padding:10px;gap:6px}
  .tbar .seg{width:100%;order:-1}
  .tbar .seg button{flex:1}
  .dlabel{font-size:12.5px;width:100%;order:-1}
  .foot{padding:11px 12px}
  .foot .b{flex:1;min-width:120px}

  /* the standup table becomes one card per developer */
  table.resp tbody tr{padding:12px 13px;background:var(--fill);border-radius:14px;
    margin-bottom:9px;border:0}
  table.resp tbody tr:last-child{margin-bottom:0}
  .sheet tbody{display:block;padding:10px 10px 2px}
  .gt tr.ghost .c-pr,.gt tr.ghost .c-st,.gt tr.ghost .c-es,.gt tr.ghost select.c-st{opacity:1}
  .sheet .acts{opacity:1;display:flex;justify-content:flex-end;gap:2px;padding-top:6px}
  .sheet .pcell{padding-bottom:8px}
  .gt input,.gt select,.gt textarea{background-color:var(--field);border-color:var(--hair)}
  .tcell textarea{min-height:44px}
  select.c-st{width:auto;min-width:130px}

  /* plan: keep names visible, let the days scroll */
  .pnm{width:92px;flex:0 0 92px;padding:8px;font-size:12.5px}
  .calin{min-width:560px}
  .bk{height:22px;font-size:11px}
  .gh{width:16px}
  .dcell b{font-size:13px}

  /* history calendar */
  .cday{min-height:44px;border-radius:10px}
  .calwrap{padding:10px 12px 14px}
  .dayhd{padding:12px}
  .dayl{font-size:16px}

  /* reports */
  .bigstats{grid-template-columns:1fr 1fr;gap:10px}
  .bs{padding:13px 14px}
  .bsv{font-size:27px}
  .spark{height:60px}
  .menu{right:10px;left:10px;width:auto;top:52px}
}
@media (max-width:520px){
  .calin{min-width:428px}
  .pnm{width:78px;flex:0 0 78px;font-size:12px;padding:8px 6px}
  .dcell b{font-size:12px}
  .dcell span{font-size:8.5px}
}
@media (max-width:400px){
  .bigstats{grid-template-columns:1fr}
  .wordmark{display:none}
  .tbar .b{font-size:12px;padding:0 11px}
}
/* landscape phones: don't waste vertical space */
@media (max-height:480px) and (orientation:landscape){
  header{padding:6px 0}
  nav.tabs{padding:4px}
  nav.tabs button svg{width:18px;height:18px}
}

/* ---- history ---- */
.calhd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.calhd span{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--txt3);text-align:center}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cday{position:relative;aspect-ratio:1.35;min-height:46px;border:0;border-radius:11px;cursor:pointer;
  background:var(--fill);color:var(--txt2);font-family:var(--sans);display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:background .15s,transform .12s}
.cday b{font-size:14px;font-weight:500}
.cday em{font-style:normal;font-size:10.5px;font-weight:700;color:var(--blue)}
.cday.void{background:transparent;cursor:default;pointer-events:none}
.cday.wknd{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.cday.has{background:rgba(10,132,255,.15);color:var(--txt)}
.cday.has b{font-weight:600}
.cday:hover:not(.void){transform:scale(1.05)}
.cday.now{box-shadow:inset 0 0 0 1.5px var(--saffron)}
.cday.now b{color:var(--saffron)}
.cday.sel{background:var(--blue);color:#fff}
.cday.sel b,.cday.sel em{color:#fff}
.calwrap{padding:12px 16px 16px;border-bottom:1px solid var(--hair);background:var(--fill)}
.calbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.dayhd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:14px 16px;
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
.dayl{font-size:17px;font-weight:600;letter-spacing:-.02em}
.histtbl td{vertical-align:top}
.wrapcell{white-space:pre-wrap;word-break:break-word;line-height:1.5}
@media(max-width:640px){.cday{min-height:40px}.cday b{font-size:13px}}

/* ---- backups ---- */
.snaps{display:flex;flex-direction:column;gap:8px}
.snap{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:13px;background:var(--fill)}
.snap .snl{font-size:14px;font-weight:500}
.snap .sns{font-size:12px;color:var(--txt2);margin-top:2px}
.snap .b{margin-left:auto}
.snap .b+.b{margin-left:0}

/* ---- reports ---- */
.bigstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
.bs{padding:16px 18px;border-radius:16px;background:var(--fill)}
.bsv{font-size:34px;font-weight:700;letter-spacing:-.04em;line-height:1}
.bso{font-size:17px;font-weight:500;color:var(--txt3)}
.bsl{font-size:12.5px;color:var(--txt2);margin-top:6px}
.secn{border-top:1px solid var(--hair)}
.secl{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--txt3);margin-bottom:12px}
.statbar{display:flex;height:26px;border-radius:980px;overflow:hidden;background:var(--fill);gap:2px}
.stg{transition:width .5s cubic-bezier(.2,.85,.25,1)}
.stleg{display:flex;flex-wrap:wrap;gap:16px;margin-top:11px;font-size:13px;color:var(--txt2)}
.stlg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.stlg b{color:var(--txt);margin-left:4px}
.ranks{display:flex;flex-direction:column;gap:9px}
.rk{display:grid;grid-template-columns:22px minmax(84px,132px) 1fr 34px;
  grid-template-areas:"n name bar v" ". meta meta meta";gap:4px 11px;align-items:center}
.rkn{grid-area:n;font-size:12px;color:var(--txt3);text-align:right}
.rkname{grid-area:name;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rkbar{grid-area:bar;position:relative;height:20px;background:var(--fill);border-radius:980px;overflow:hidden}
.rkbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);border-radius:980px;
  transition:width .5s cubic-bezier(.2,.85,.25,1)}
.rkbar em{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:980px}
.rkv{grid-area:v;font-size:15px;font-weight:600;text-align:right}
.rkm{grid-area:meta;font-size:11.5px;color:var(--txt3);padding-left:0}
@media(min-width:720px){.rk{grid-template-columns:22px 132px 1fr 34px 128px;
  grid-template-areas:"n name bar v meta"}.rkm{text-align:right}}
.spark{display:flex;align-items:flex-end;gap:4px;height:78px}
.spk{flex:1;min-width:14px;display:flex;flex-direction:column;justify-content:flex-end;
  align-items:center;height:100%;gap:5px}
.spk i{display:block;width:100%;max-width:34px;background:var(--blue);border-radius:5px;
  min-height:3px;opacity:.85;transition:height .5s cubic-bezier(.2,.85,.25,1)}
.spk em{font-size:10px;color:var(--txt3);font-style:normal}

/* ---- chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:13px;font-weight:500;
  background:var(--fill);color:var(--txt);border:1px solid transparent;border-radius:980px;
  padding:6px 12px;cursor:pointer;transition:.14s}
.chip:hover{background:var(--glassh)}
.chip.add{color:var(--blue)}
.chip.on .x{color:var(--txt3);font-size:11px;margin-left:1px}
.chip.on:hover .x{color:var(--red)}

/* ---- plan grid ---- */
.brushes{display:flex;flex-wrap:wrap;gap:7px;padding:11px 14px;border-bottom:1px solid var(--hair)}
.brush.sel{font-weight:600}
.plangrid{border-collapse:separate;border-spacing:3px;padding:6px 10px 10px}
.plangrid th .sublabel{display:block;font-size:9.5px;font-weight:500;color:var(--txt3);
  text-transform:none;letter-spacing:0;margin-top:1px;white-space:nowrap}
.plangrid th{font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;
  color:var(--txt3);padding:6px 4px;text-align:center;border:0;white-space:nowrap}
.plangrid th.pname{text-align:left;padding-left:8px;width:150px;position:sticky;left:0;z-index:2;
  background:var(--glassS);backdrop-filter:blur(20px);font-size:13.5px;font-weight:500;
  color:var(--txt);text-transform:none;letter-spacing:0;overflow:hidden;text-overflow:ellipsis}
.plangrid td{border:0}
.pcell2{height:32px;min-width:92px;border-radius:8px;background:var(--fill);cursor:pointer;
  font-size:11.5px;font-weight:600;text-align:center;padding:0 5px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;user-select:none;transition:filter .12s}
.pcell2:hover{filter:brightness(1.35)}
.freecol{font-size:12px;color:var(--txt2);text-align:right;padding-right:8px;white-space:nowrap;width:86px}
.freecol b{color:var(--accent)}
th.freecol{color:var(--txt3)}

/* ---- wrapping task cells ---- */
.tcell textarea{width:100%;resize:none;overflow:hidden;line-height:1.5;min-height:28px;
  white-space:pre-wrap;word-break:break-word;font-family:var(--sans)}
.dense .tcell textarea{font-size:13.5px;padding:5px 8px}
.dense td{vertical-align:top}
.dense .pcell,.dense .acts,.dense td:has(.c-st){vertical-align:middle}
.pcell .rmdev{opacity:0;margin-left:2px;font-size:11px;transition:opacity .14s}
.pcell:hover .rmdev{opacity:.75}
.pcell .rmdev:hover{opacity:1}
.acts .bul,.acts .num{font-size:11px;font-weight:700;color:var(--txt3)}
.acts .bul:hover,.acts .num:hover{color:var(--blue);background:rgba(10,132,255,.12)}

/* ---- status colours ---- */
select.c-st{font-weight:600;text-align:center;border-radius:980px;padding:4px 6px;
  background-image:none;text-align-last:center}
.gt select.c-st.s-planned{background-color:rgba(64,200,224,.18);color:var(--teal)}
.gt select.c-st.s-progress{background-color:rgba(10,132,255,.2);color:var(--blue)}
.gt select.c-st.s-blocked{background-color:rgba(255,59,48,.2);color:var(--red)}
.gt select.c-st.s-done{background-color:rgba(52,199,89,.2);color:var(--green)}

.gt tr.ghost select.c-st{opacity:.5}
.gt tr:hover select.c-st,.gt tr:focus-within select.c-st{opacity:1}

/* ---- footer ---- */
.foot{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--hair)}
.tips{padding:0 14px 12px;font-size:11.5px;color:var(--txt3)}
.tips b{color:var(--txt2);font-weight:600}
@media(max-width:720px){.tips{display:none}.pcell .rmdev{opacity:.7}}

/* ---- wordmark: a slow highlight passes across, then rests ---- */
.wordmark{background:linear-gradient(100deg,var(--txt) 0%,var(--txt) 40%,var(--saffron) 50%,
  var(--txt) 60%,var(--txt) 100%);background-size:260% 100%;background-position:170% 0;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shine 6s ease-in-out infinite}
@keyframes shine{0%{background-position:170% 0}30%,100%{background-position:-70% 0}}
.mark{animation:markb 6s ease-in-out infinite}
@keyframes markb{0%,88%,100%{transform:rotate(0) scale(1)}92%{transform:rotate(-7deg) scale(1.07)}96%{transform:rotate(4deg) scale(1.03)}}

/* ---- entrance (5.6s, skippable) ---- */
#intro{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:var(--bg);
  transition:opacity .6s ease,transform .6s cubic-bezier(.5,0,.75,0);cursor:pointer;
  padding-bottom:env(safe-area-inset-bottom,0px)}
#intro.out{opacity:0;transform:scale(1.3);pointer-events:none}
#intro::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 44%,rgba(255,159,10,.16),transparent 62%);
  opacity:0;animation:iglow 5s ease-in-out both}
@keyframes iglow{0%,12%{opacity:0}40%{opacity:1}100%{opacity:.35}}
.istage{display:flex;flex-direction:column;align-items:center;gap:20px;position:relative;z-index:1}
.ib{position:relative;width:124px;height:124px;display:grid;place-items:center}

.imk{width:104px;height:104px;display:block;grid-area:1/1;
  animation:isettle 1.1s cubic-bezier(.18,1.35,.4,1) .75s both}
@keyframes isettle{0%{transform:scale(.86) rotate(-8deg)}100%{transform:scale(1) rotate(0)}}
.idraw{stroke-dasharray:170;stroke-dashoffset:170;animation:idraw 1.15s cubic-bezier(.5,0,.2,1) .15s both}
@keyframes idraw{to{stroke-dashoffset:0}}
.ifill{opacity:0;animation:ifade .7s ease .95s both}
.idetail{opacity:0;animation:ifade .6s ease 1.25s both}
@keyframes ifade{to{opacity:1}}
.imk{filter:drop-shadow(0 12px 38px rgba(255,159,10,0));animation:isettle 1.1s cubic-bezier(.18,1.35,.4,1) .75s both,
  iglowmk 1.4s ease 1.2s both}
@keyframes iglowmk{to{filter:drop-shadow(0 12px 38px rgba(255,159,10,.55))}}

.iring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--saffron);
  opacity:0;animation:iring 1.5s cubic-bezier(.2,.7,.3,1) both}
.r1{animation-delay:1.35s}.r2{animation-delay:1.55s}.r3{animation-delay:1.75s}
@keyframes iring{0%{transform:scale(.55);opacity:.7}100%{transform:scale(2.7);opacity:0}}
.ispark{position:absolute;width:var(--sz);height:var(--sz);border-radius:50%;background:var(--saffron);
  opacity:0;animation:ispark var(--t) cubic-bezier(.15,.8,.3,1) var(--dl) both}
.ispark:nth-child(3n){background:#FFD84D}
.ispark:nth-child(3n+1){background:#EF5F2B}
@keyframes ispark{0%{transform:rotate(var(--a)) translateX(16px) scale(.4);opacity:1}
  100%{transform:rotate(var(--a)) translateX(var(--d)) scale(0);opacity:0}}

.iword{display:flex;gap:1px;font-size:34px;font-weight:700;letter-spacing:-.035em;color:var(--txt)}

<script>
/* ==================== config ==================== */
const KEY='devsamosa:v1', OLD='teampulse:v1', SESS='devsamosa:session';
const SHARED=true, SESSION_HOURS=12;
let DB={v:2,authV:0,dataV:0,user:'',pass:'',recovery:'',roster:[],people:[],projects:[],updates:[],allocs:[]};
let ME=null, ADMIN=false, view='today', THEME='dark';
const PAL=['#0A84FF','#FF9F0A','#BF5AF2','#30D158','#FF375F','#40C8E0','#FF6B35','#5E5CE6','#FFD60A','#64D2FF'];

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ==================== dates ==================== */
const D={
  today:()=>D.iso(new Date()),
  iso:d=>{const z=new Date(d);return `${z.getFullYear()}-${String(z.getMonth()+1).padStart(2,'0')}-${String(z.getDate()).padStart(2,'0')}`},
  p:s=>{const[y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d)},
  add:(s,n)=>{const d=D.p(s);d.setDate(d.getDate()+n);return D.iso(d)},
  diff:(a,b)=>Math.round((D.p(b)-D.p(a))/864e5),
  monday:s=>{const d=D.p(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return D.iso(d)},
  som:s=>s.slice(0,8)+'01',
  eom:s=>{const d=D.p(s);return D.iso(new Date(d.getFullYear(),d.getMonth()+1,0))},
  soq:s=>{const d=D.p(s);return D.iso(new Date(d.getFullYear(),Math.floor(d.getMonth()/3)*3,1))},
  short:s=>D.p(s).toLocaleDateString('en-GB',{day:'2-digit',month:'short'}),
  long:s=>D.p(s).toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}),
  wknd:s=>[0,6].includes(D.p(s).getDay()),
  wdays:(a,b)=>{let n=0;for(let c=a;c<=b&&n<9999;c=D.add(c,1))if(!D.wknd(c))n++;return n}
};

/* ==================== cloud: one shared board across devices ==================== */
const CLOUD={url:'',key:'',token:'',refresh:'',exp:0,email:'',version:0,poll:null,dirty:false};
const CFGKEY='devsamosa:cloud';

function cloudCfgLoad(){
  try{const r=JSON.parse(localStorage.getItem(CFGKEY)||'null');
    if(r&&r.url&&r.key){Object.assign(CLOUD,r);return true}}catch(e){}
  return false;
}
function cloudCfgSave(){
  try{localStorage.setItem(CFGKEY,JSON.stringify({url:CLOUD.url,key:CLOUD.key,
    token:CLOUD.token,refresh:CLOUD.refresh,exp:CLOUD.exp,email:CLOUD.email}))}catch(e){}
}
function cloudForget(){
  try{localStorage.removeItem(CFGKEY)}catch(e){}
  Object.assign(CLOUD,{url:'',key:'',token:'',refresh:'',exp:0,email:'',version:0});
}

async function sbAuth(path,body){
  const r=await fetch(CLOUD.url+'/auth/v1/'+path,{method:'POST',
    headers:{apikey:CLOUD.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error_description||d.msg||d.message||d.error||'Could not sign in');
  return d;
}
function sbSession(d){
  CLOUD.token=d.access_token||'';CLOUD.refresh=d.refresh_token||'';
  CLOUD.exp=Date.now()+((d.expires_in||3600)*1000)-60000;
  CLOUD.email=(d.user&&d.user.email)||CLOUD.email;
  cloudCfgSave();
}
async function sbRefresh(){
  if(!CLOUD.refresh)return false;
  try{sbSession(await sbAuth('token?grant_type=refresh_token',{refresh_token:CLOUD.refresh}));return true}
  catch(e){return false}
}
async function sbRest(path,opts={}){
  if(CLOUD.exp&&Date.now()>CLOUD.exp)await sbRefresh();
  const go=()=>fetch(CLOUD.url+'/rest/v1/'+path,{...opts,headers:{
    apikey:CLOUD.key,Authorization:'Bearer '+(CLOUD.token||CLOUD.key),
    'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}});
  let r=await go();
  if(r.status===401&&await sbRefresh())r=await go();
  if(!r.ok)throw new Error('cloud '+r.status+': '+(await r.text()).slice(0,180));
  return r.status===204?null:r.json().catch(()=>null);
}

/* the whole board is one row; version guards against silent overwrites */
async function cloudLoad(){
  const rows=await sbRest('board?id=eq.main&select=data,version');
  if(!rows||!rows.length){
    await sbRest('board',{method:'POST',
      body:JSON.stringify({id:'main',version:1,data:{}})});
    CLOUD.version=1;return null;
  }
  CLOUD.version=rows[0].version||1;
  const d=rows[0].data;
  return d&&Object.keys(d).length?JSON.stringify(d):null;
}
async function cloudSave(json){
  const next=CLOUD.version+1;
  const rows=await sbRest(`board?id=eq.main&version=eq.${CLOUD.version}`,{method:'PATCH',
    body:JSON.stringify({data:JSON.parse(json),version:next,updated_at:new Date().toISOString()})});
  if(!rows||!rows.length){
    /* someone else saved first — take theirs rather than clobber it */
    const fresh=await cloudLoad();
    if(fresh){try{DB={...DB,...JSON.parse(fresh)}}catch(e){}}
    render();
    toast('Someone else updated the board — reloaded their version',1);
    return false;
  }
  CLOUD.version=next;return true;
}
async function cloudPoll(){
  if(document.hidden||!CLOUD.token||DRAG||document.activeElement&&
     /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  try{
    const rows=await sbRest('board?id=eq.main&select=version');
    if(rows&&rows.length&&rows[0].version>CLOUD.version){
      const fresh=await cloudLoad();
      if(fresh){try{DB={...DB,...JSON.parse(fresh)}}catch(e){}}
      render();toast('Updated from another device');
    }
  }catch(e){}
}
function cloudWatch(){
  clearInterval(CLOUD.poll);
  CLOUD.poll=setInterval(cloudPoll,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)cloudPoll()});
}

/* ---- screens ---- */
function cloudConnect(){
  $('#app').classList.add('hidden');$('#tabs').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  $('#lock').innerHTML=`<div class="lockcard wide2" id="lc">${markSVG('mark')}
    <h1>DevSamosa</h1><p class="tag">Connect your team database</p>
    <label class="f"><span class="lbl">Project URL</span>
      <input id="cu" placeholder="https://xxxx.supabase.co" autocapitalize="none" spellcheck="false"></label>
    <label class="f"><span class="lbl">Anon public key</span>
      <input id="ck" placeholder="eyJhbGci…" autocapitalize="none" spellcheck="false"></label>
    <p class="lockerr" id="err"></p>
    <button class="b p wide" id="go">Connect</button>
    <button class="b ghost wide" id="skip" style="margin-top:8px">Use this device only</button>
    <p class="hint" style="margin-top:14px">Both values are in your Supabase project under
      Settings → API. The anon key is safe to use here — the database rules only allow signed-in users.</p>
    <p class="hint" style="margin-top:10px"><a href="#" id="gh">Use a GitHub repository instead</a></p>
  </div>`;
  $('#gh').onclick=e=>{e.preventDefault();ghConnect()};
  $('#skip').onclick=()=>{cloudForget();location.reload()};
  $('#go').onclick=async()=>{
    const u=$('#cu').value.trim().replace(/\/+$/,''), k=$('#ck').value.trim();
    if(!/^https:\/\/.+/.test(u))return $('#err').textContent='The URL should start with https://';
    if(k.length<20)return $('#err').textContent='That key looks too short.';
    CLOUD.url=u;CLOUD.key=k;
    $('#err').textContent='Checking…';
    try{
      const r=await fetch(u+'/rest/v1/board?select=id&limit=1',{headers:{apikey:k,Authorization:'Bearer '+k}});
      if(r.status===404)return $('#err').textContent='Connected, but no "board" table. Run the setup SQL first.';
      cloudCfgSave();cloudLock();
    }catch(e){$('#err').textContent='Could not reach that URL. Check it and your connection.'}
  };
}
function cloudLock(mode){
  mode=mode||'in';
  $('#app').classList.add('hidden');$('#tabs').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  const F={
    in:`<p class="tag">Sign in</p>
      <label class="f"><span class="lbl">Email</span><input id="em" type="email" value="${esc(CLOUD.email||'')}"
        autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f"><span class="lbl">Password</span><span class="pwwrap">
        <input type="password" id="pw" autocomplete="current-password" placeholder="Enter your password">
        <button type="button" class="pweye" data-f="pw">Show</button></span></label>
      <p class="lockerr" id="err"></p>
      <button class="b p wide" id="go">Sign in</button>
      <button class="b ghost wide" id="su" style="margin-top:8px">Create an account</button>
      <button class="b ghost wide" id="fg">Forgot password</button>`,
    up:`<p class="tag">Create an account</p>
      <label class="f"><span class="lbl">Email</span><input id="em" type="email"
        autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label class="f"><span class="lbl">Password</span><span class="pwwrap">
        <input type="password" id="pw" autocomplete="new-password" placeholder="At least 6 characters">
        <button type="button" class="pweye" data-f="pw">Show</button></span></label>
      <p class="lockerr" id="err"></p>
      <button class="b p wide" id="go">Create account</button>
      <button class="b ghost wide" id="bk" style="margin-top:8px">Back to sign in</button>`,
    fg:`<p class="tag">Reset your password</p>
      <label class="f"><span class="lbl">Email</span><input id="em" type="email"
        value="${esc(CLOUD.email||'')}" autocapitalize="none" spellcheck="false"></label>
      <p class="lockerr" id="err"></p>
      <button class="b p wide" id="go">Email me a reset link</button>
      <button class="b ghost wide" id="bk" style="margin-top:8px">Back to sign in</button>`
  }[mode];
  $('#lock').innerHTML=`<div class="lockcard" id="lc">${markSVG('mark')}
    <h1>DevSamosa</h1>${F}
    <p class="hint" style="margin-top:14px">Shared team board · <a href="#" id="dis">change database</a></p></div>`;
  const fail=m=>{$('#err').textContent=m;$('#lc').classList.remove('shake');
    void $('#lc').offsetWidth;$('#lc').classList.add('shake')};
  $('#dis').onclick=e=>{e.preventDefault();cloudConnect()};
  if($('#su'))$('#su').onclick=()=>cloudLock('up');
  if($('#fg'))$('#fg').onclick=()=>cloudLock('fg');
  if($('#bk'))$('#bk').onclick=()=>cloudLock('in');
  $$('#lock .pweye').forEach(b=>b.onclick=()=>{const f=$('#'+b.dataset.f);
    const s=f.type==='password';f.type=s?'text':'password';b.textContent=s?'Hide':'Show';f.focus()});
  $$('#lock input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')$('#go').click()});
  $('#go').onclick=async()=>{
    const em=$('#em').value.trim();
    if(!em)return fail('Enter your email');
    $('#go').disabled=true;
    try{
      if(mode==='fg'){
        await sbAuth('recover',{email:em});
        $('#go').disabled=false;
        return fail('Check your inbox for the reset link.');
      }
      const pw=$('#pw').value;
      if(pw.length<6)return $('#go').disabled=false,fail('Password needs at least 6 characters');
      CLOUD.email=em;
      if(mode==='up'){
        const d=await sbAuth('signup',{email:em,password:pw});
        if(!d.access_token){$('#go').disabled=false;
          return fail('Account created. Confirm the email we just sent, then sign in.')}
        sbSession(d);
      }else sbSession(await sbAuth('token?grant_type=password',{email:em,password:pw}));
      await cloudStart(true);
    }catch(e){$('#go').disabled=false;fail(String(e.message||e).slice(0,120))}
  };
  setTimeout(()=>{const f=$('#em');f&&(f.value?($('#pw')||f).focus():f.focus())},240);
}
async function cloudStart(fresh){
  STORE.mode='cloud';STORE.label='Team database · '+CLOUD.email;
  try{
    const raw=await cloudLoad();
    if(raw){try{DB={...DB,...JSON.parse(raw)}}catch(e){}}
    if(!DB.people.length&&typeof SEED!=='undefined')mergeSeed();
    DB.authV=3;DB.dataV=2;
    cloudWatch();
    enter(fresh);
  }catch(e){
    cloudLock('in');
    setTimeout(()=>{const el=$('#err');if(el)el.textContent=String(e.message||e).slice(0,140)},60);
  }
}

/* ==================== github: a private repo as the shared board ==================== */
/* The board is split across files instead of held as one blob:
     shared.json        people, projects, roster, auth
     people/<id>.json   that person's updates and allocs
   Two saves for different developers touch different files with different shas,
   so they cannot collide — which is what removes the single-document limit.     */
const GH={owner:'',repo:'',branch:'main',token:'',
  head:'',tree:'',shas:{},last:{},busy:false,again:false,poll:null};
const GHKEY='devsamosa:gh', SHFILE='shared.json';

/* ---- one shared password for the whole team ----------------------------
   The repo and token are encrypted into the line below with AES-GCM, using a
   key stretched from the team password with PBKDF2. index.html is public, so
   this blob is public too — it is worthless without the password, and the
   password is never stored anywhere. Regenerate with setup-shared-login.js.
   Left null until that has been run; the app then asks for repo + token
   per device, as before.                                                   */
const GHENC={"salt":"t6XrtJnpisyDmIM5NV86wQ==","iv":"5VFv6j4I7AocjAiL","ct":"4Rn/wbG9MligtxXsa2X8XTq63kaTNVm95jw1HlwJ/O+FNqbjDDW8yP0ijaVj1P/2EG6MU2VL6ymiiW1yUVS5Z1FDOTYddIHDVhQYmhi7iGBlBXPLhEfhdzqFQ0bojl+tmF6rpn778rgLPouifHF0OrFO5K6kfnf/L4ug7bbbv6n2VK0pJOmxwnu6ftP/eUasShBfsVJ7SNiZkCDh/INxVesG9QkWYH1DqACx8zvQWQnNszUB1iI5qpvGZA==","it":600000};

async function ghKey(pass,salt,it){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),
    'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const b64u=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)
  s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function ghSeal(pass,obj,it){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const k=await ghKey(pass,salt,it);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},k,
    new TextEncoder().encode(JSON.stringify(obj))));
  return {salt:b64u(salt),iv:b64u(iv),ct:b64u(ct),it};
}
/* AES-GCM is authenticated, so a wrong password throws rather than returning
   plausible rubbish — that is what makes this the login check as well */
async function ghOpen(pass,box){
  const k=await ghKey(pass,unb64(box.salt),box.it||600000);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(box.iv)},k,unb64(box.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function ghUnlock(pass){
  const cfg=await ghOpen(pass,GHENC);
  if(!cfg.owner||!cfg.repo||!cfg.token)throw new Error('bad payload');
  return cfg;
}

/* ---- the device PIN -----------------------------------------------------
   The team passphrase is typed once per device. After that the token is kept
   re-encrypted under a 4-digit PIN in this browser's storage only — never
   published — so a short PIN is fine here: guessing it means already holding
   the unlocked device. Wrong guesses are counted and the copy is destroyed
   after PINTRIES, which is the limit a server would normally enforce.       */
const PINKEY='devsamosa:pin', PINIT=300000, PINTRIES=5;

function ghPinBox(){
  try{const r=JSON.parse(localStorage.getItem(PINKEY)||'null');
    return r&&r.ct?r:null}catch(e){return null}
}
async function ghPinSet(pin,cfg){
  const box=await ghSeal(pin,cfg,PINIT);
  box.tries=0;
  try{localStorage.setItem(PINKEY,JSON.stringify(box))}catch(e){}
}
function ghPinForget(){try{localStorage.removeItem(PINKEY)}catch(e){}}
async function ghPinOpen(pin){
  const box=ghPinBox();
  if(!box)throw new Error('no pin set');
  try{
    const cfg=await ghOpen(pin,box);
    box.tries=0;try{localStorage.setItem(PINKEY,JSON.stringify(box))}catch(e){}
    return cfg;
  }catch(e){
    box.tries=(box.tries||0)+1;
    if(box.tries>=PINTRIES){ghPinForget();const x=new Error('locked out');x.locked=true;throw x}
    try{localStorage.setItem(PINKEY,JSON.stringify(box))}catch(e2){}
    const x=new Error('wrong pin');x.left=PINTRIES-box.tries;throw x;
  }
}
const pfile=id=>'people/'+id+'.json';
const isShard=p=>p===SHFILE||/^people\/[^/]+\.json$/.test(p);

function ghCfgLoad(){
  try{const r=JSON.parse(localStorage.getItem(GHKEY)||'null');
    if(r&&r.owner&&r.repo&&r.token){Object.assign(GH,r);return true}}catch(e){}
  return false;
}
function ghCfgSave(){
  try{localStorage.setItem(GHKEY,JSON.stringify({owner:GH.owner,repo:GH.repo,
    branch:GH.branch||'main',token:GH.token}))}catch(e){}
}
function ghForget(){
  try{localStorage.removeItem(GHKEY)}catch(e){}
  Object.assign(GH,{owner:'',repo:'',token:'',head:'',tree:'',shas:{},last:{}});
}

/* btoa throws on anything non-Latin1, and spreading a big array blows the stack */
function b64enc(s){
  const b=new TextEncoder().encode(s);let o='';
  for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
  return btoa(o);
}
function b64dec(b){
  const s=atob(String(b||'').replace(/\s+/g,''));
  const a=new Uint8Array(s.length);
  for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);
  return new TextDecoder().decode(a);
}

const ghRepo=()=>'/repos/'+GH.owner+'/'+GH.repo;
async function ghApi(path,opts={}){
  const r=await fetch('https://api.github.com'+path,{...opts,headers:{
    Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28',
    ...(opts.body?{'Content-Type':'application/json'}:{}),...(opts.headers||{})}});
  if(r.status===404&&opts.soft404)return null;
  if(!r.ok){
    const e=new Error('github '+r.status+': '+(await r.text().catch(()=>'')).slice(0,180));
    e.status=r.status;throw e;
  }
  return r.status===204?null:r.json().catch(()=>null);
}
const ghPost=(p,body)=>ghApi(p,{method:'POST',body:JSON.stringify(body)});

/* ---- splitting the board into files, and putting it back together ---- */
/* every id that owns rows, even one whose person was removed from the board */
function ghIds(db){
  const s=new Set((db.people||[]).map(p=>p.id));
  (db.updates||[]).forEach(u=>s.add(u.personId));
  (db.allocs||[]).forEach(a=>s.add(a.personId));
  return [...s].filter(Boolean);
}
function ghSplit(db){
  const out={},by={};
  out[SHFILE]=JSON.stringify({v:db.v,authV:db.authV,dataV:db.dataV,
    user:db.user,pass:db.pass,recovery:db.recovery,roster:db.roster||[],
    people:db.people||[],projects:db.projects||[],sprint:db.sprint},null,1);
  ghIds(db).forEach(id=>by[id]={updates:[],allocs:[]});
  (db.updates||[]).forEach(u=>{const b=by[u.personId];if(b)b.updates.push(u)});
  (db.allocs||[]).forEach(a=>{const b=by[a.personId];if(b)b.allocs.push(a)});
  Object.keys(by).forEach(id=>out[pfile(id)]=JSON.stringify(by[id],null,1));
  return out;
}
function ghMerge(files){
  let db={};
  try{db=JSON.parse(files[SHFILE]||'{}')||{}}catch(e){db={}}
  const u=[],a=[];
  Object.keys(files).forEach(p=>{
    if(p===SHFILE||!isShard(p))return;
    try{const d=JSON.parse(files[p])||{};
      (d.updates||[]).forEach(x=>u.push(x));(d.allocs||[]).forEach(x=>a.push(x));
    }catch(e){}
  });
  /* ids are time-ordered, so this is stable no matter what order files arrive in */
  const byId=(x,y)=>x.id<y.id?-1:x.id>y.id?1:0;
  db.updates=u.sort(byId);db.allocs=a.sort(byId);
  return db;
}

/* ---- reading ---- */
async function ghHead(){
  const r=await ghApi(ghRepo()+'/git/ref/heads/'+GH.branch,{soft404:true});
  return r&&r.object?r.object.sha:'';
}
async function ghBlob(sha){
  const b=await ghApi(ghRepo()+'/git/blobs/'+sha);
  return b64dec(b&&b.content);
}
async function ghLoad(){
  const head=await ghHead();
  if(!head){Object.assign(GH,{head:'',tree:'',shas:{},last:{}});return null}
  const t=await ghApi(ghRepo()+'/git/trees/'+head+'?recursive=1');
  const shas={};
  (t.tree||[]).forEach(n=>{if(n.type==='blob'&&isShard(n.path))shas[n.path]=n.sha});
  const files={};
  await Promise.all(Object.keys(shas).map(async p=>{
    /* blobs are content-addressed — same sha means same bytes, so never refetch */
    files[p]=(GH.shas[p]===shas[p]&&GH.last[p]!=null)?GH.last[p]:await ghBlob(shas[p]);
  }));
  Object.assign(GH,{head,tree:t.sha,shas,last:{...files}});
  return files[SHFILE]?JSON.stringify(ghMerge(files)):null;
}

/* ---- writing ---- */
function ghMsg(path){
  if(path&&path.indexOf('people/')===0){
    const p=(DB.people||[]).find(x=>pfile(x.id)===path);
    if(p)return 'Update '+p.name+' · '+D.today();
  }
  return 'Update board · '+D.today();
}
async function ghConflict(){
  const fresh=await ghLoad();
  if(fresh){try{DB={...DB,...JSON.parse(fresh)}}catch(e){}}
  render();
  toast('Someone else updated the board — reloaded their version',1);
  return false;
}
const ghStale=e=>e.status===409||e.status===422;

async function ghPutOne(path,text){
  const body={message:ghMsg(path),content:b64enc(text),branch:GH.branch};
  if(GH.shas[path])body.sha=GH.shas[path];
  try{
    const r=await ghApi(ghRepo()+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)});
    GH.shas[path]=r.content.sha;GH.last[path]=text;
    GH.head=r.commit.sha;GH.tree='';       /* root tree moved; refetched when needed */
    return true;
  }catch(e){if(ghStale(e))return await ghConflict();throw e}
}
/* several files at once (say, removing a person, or the very first save) go in
   ONE commit, so the board can never be caught half-written. Passing the text
   inline as `content` lets the tree call create the blobs, so this is a fixed
   four requests no matter how many files moved. */
async function ghCommitAll(files,changed,gone){
  try{
    const nodes=changed.map(p=>({path:p,mode:'100644',type:'blob',content:files[p]}));
    const body={tree:nodes};
    if(GH.head){
      if(!GH.tree)GH.tree=(await ghApi(ghRepo()+'/git/commits/'+GH.head)).tree.sha;
      body.base_tree=GH.tree;
      gone.forEach(p=>nodes.push({path:p,mode:'100644',type:'blob',sha:null}));
    }
    const tree=await ghPost(ghRepo()+'/git/trees',body);
    const commit=await ghPost(ghRepo()+'/git/commits',
      {message:ghMsg(),tree:tree.sha,parents:GH.head?[GH.head]:[]});
    if(GH.head)await ghApi(ghRepo()+'/git/refs/heads/'+GH.branch,
      {method:'PATCH',body:JSON.stringify({sha:commit.sha})});
    else await ghPost(ghRepo()+'/git/refs',{ref:'refs/heads/'+GH.branch,sha:commit.sha});
    GH.head=commit.sha;GH.tree=tree.sha;
    changed.forEach(p=>GH.last[p]=files[p]);
    gone.forEach(p=>{delete GH.last[p];delete GH.shas[p]});
    /* the tree response only lists the top level, so refresh the blob shas that
       the one-file fast path relies on */
    const t=await ghApi(ghRepo()+'/git/trees/'+tree.sha+'?recursive=1');
    const shas={};
    (t.tree||[]).forEach(n=>{if(n.type==='blob'&&isShard(n.path))shas[n.path]=n.sha});
    GH.shas=shas;
    return true;
  }catch(e){if(ghStale(e))return await ghConflict();throw e}
}
async function ghFlush(){
  const files=ghSplit(DB);
  const changed=Object.keys(files).filter(p=>files[p]!==GH.last[p]);
  const gone=Object.keys(GH.last).filter(p=>!(p in files));
  if(!changed.length&&!gone.length)return true;
  if(changed.length===1&&!gone.length)return await ghPutOne(changed[0],files[changed[0]]);
  return await ghCommitAll(files,changed,gone);
}
/* a commit takes about a second, so a save can land while one is still in
   flight — keep one request out at a time and repeat if the board moved on */
async function ghSave(){
  if(GH.busy){GH.again=true;return true}
  GH.busy=true;
  try{
    let ok=true,guard=0;
    do{GH.again=false;ok=await ghFlush()}while(GH.again&&ok&&++guard<5);
    return ok;
  }finally{GH.busy=false}
}

/* ---- watching for other devices ---- */
async function ghPoll(){
  if(document.hidden||!GH.token||GH.busy||DRAG||document.activeElement&&
     /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  try{
    const head=await ghHead();                /* one request; usually the whole tick */
    if(!head||head===GH.head)return;
    const fresh=await ghLoad();
    if(fresh){try{DB={...DB,...JSON.parse(fresh)}}catch(e){}}
    render();toast('Updated from another device');
  }catch(e){}
}
function ghWatch(){
  clearInterval(GH.poll);
  GH.poll=setInterval(ghPoll,15000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)ghPoll()});
}

  $('#lock').classList.remove('hidden');

    <label class="f"><span class="lbl">Team password</span><span class="pwwrap">
      <input type="password" id="tp" autocomplete="current-password"
        placeholder="The password your team shares">
      <button type="button" class="pweye" data-f="tp">Show</button></span></label>
    <p class="lockerr" id="err"></p>
    <button class="b p wide" id="go">Sign in</button>
    <p class="hint" style="margin-top:14px">Everyone uses the same password, and everyone
      sees the same board. <a href="#" id="own">Use this device only</a></p>
  </div>`;
  const fail=m=>{$('#err').textContent=m;$('#lc').classList.remove('shake');
    void $('#lc').offsetWidth;$('#lc').classList.add('shake')};
  $$('#lock .pweye').forEach(b=>b.onclick=()=>{const f=$('#'+b.dataset.f);
    const s=f.type==='password';f.type=s?'text':'password';b.textContent=s?'Hide':'Show';f.focus()});
  $('#tp').onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
  $('#own').onclick=async e=>{
    e.preventDefault();ghForget();ghPinForget();
    await initStore();await load();lockScreen();

/* a keypad-friendly field: type=password keeps it hidden, inputmode drives the
   numeric keyboard on both iOS and Android */
const pinField=(id,ph)=>`<input type="password" id="${id}" inputmode="numeric"
  pattern="[0-9]*" autocomplete="off" maxlength="4" placeholder="${ph}"
  class="pin" style="letter-spacing:.5em;text-align:center;font-size:22px">`;

/* straight after the passphrase, once per device */
function ghPinNew(cfg){
  $('#app').classList.add('hidden');$('#tabs').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  $('#lock').innerHTML=`<div class="lockcard" id="lc">${markSVG('mark')}
    <h1>DevSamosa</h1><p class="tag">Pick a 4-digit PIN for this device</p>
    <label class="f"><span class="lbl">PIN</span>${pinField('p1','••••')}</label>
    <label class="f"><span class="lbl">Again</span>${pinField('p2','••••')}</label>
    <p class="lockerr" id="err"></p>
    <button class="b p wide" id="go">Save PIN</button>
    <p class="hint" style="margin-top:14px">From now on this device only asks for the PIN.
      The team password is needed again only if you sign out or clear your browser.</p>
  </div>`;
  const fail=m=>{$('#err').textContent=m;$('#lc').classList.remove('shake');
    void $('#lc').offsetWidth;$('#lc').classList.add('shake')};
  $$('#lock .pin').forEach(i=>{
    i.oninput=()=>{i.value=i.value.replace(/\D/g,'').slice(0,4);
      if(i.id==='p1'&&i.value.length===4)$('#p2').focus()};
    i.onkeydown=e=>{if(e.key==='Enter')$('#go').click()};
  });

    const a=$('#p1').value,b=$('#p2').value;
    if(!/^\d{4}$/.test(a))return fail('Four digits, please');
    if(a!==b)return fail('Those two do not match');
    $('#go').disabled=true;
    await ghPinSet(a,cfg);
    Object.assign(GH,{owner:cfg.owner,repo:cfg.repo,branch:cfg.branch||'main',token:cfg.token});
    await setSession('team','admin');ADMIN=true;
    await ghStart();
  };
  setTimeout(()=>{const f=$('#p1');f&&f.focus()},240);
}

/* every unlock after that */
function ghPinLock(){
  $('#app').classList.add('hidden');$('#tabs').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  $('#lock').innerHTML=`<div class="lockcard" id="lc">${markSVG('mark')}
    <h1>DevSamosa</h1><p class="tag">Enter your PIN</p>
    <label class="f">${pinField('pn','••••')}</label>
    <p class="lockerr" id="err"></p>
    <button class="b p wide" id="go">Unlock</button>
    <p class="hint" style="margin-top:14px"><a href="#" id="fp">Forgot your PIN?</a></p>
  </div>`;
  const fail=m=>{$('#err').textContent=m;$('#lc').classList.remove('shake');
    void $('#lc').offsetWidth;$('#lc').classList.add('shake');
    const f=$('#pn');if(f){f.value='';f.focus()}};
  $('#fp').onclick=e=>{e.preventDefault();ghPinForget();ghTeamLock()};
  const submit=async()=>{
    const pin=$('#pn').value;
    if(!/^\d{4}$/.test(pin))return fail('Four digits, please');
    $('#go').disabled=true;$('#err').textContent='…';
    let cfg;
    try{cfg=await ghPinOpen(pin)}
    catch(e){
      $('#go').disabled=false;
      if(e.locked){toast('Too many wrong PINs — sign in with the team password',1);
        return ghTeamLock()}
      return fail('Wrong PIN'+(e.left?` — ${e.left} ${e.left===1?'try':'tries'} left`:''));
    }
    Object.assign(GH,{owner:cfg.owner,repo:cfg.repo,branch:cfg.branch||'main',token:cfg.token});
    await setSession('team','admin');ADMIN=true;
    await ghStart();
  };
  $('#go').onclick=submit;
  const f=$('#pn');
  f.oninput=()=>{f.value=f.value.replace(/\D/g,'').slice(0,4);
    if(f.value.length===4)submit()};          /* no Enter needed on a keypad */
  f.onkeydown=e=>{if(e.key==='Enter')submit()};
  setTimeout(()=>f.focus(),240);
}
function ghConnect(){
  $('#app').classList.add('hidden');$('#tabs').classList.add('hidden');
  $('#lock').classList.remove('hidden');
  $('#lock').innerHTML=`<div class="lockcard wide2" id="lc">${markSVG('mark')}
    <h1>DevSamosa</h1><p class="tag">Connect your team board</p>
    <label class="f"><span class="lbl">Data repository</span>
      <input id="gr" placeholder="yourname/devsamosa-data" value="${esc(GH.owner?GH.owner+'/'+GH.repo:'')}"
        autocapitalize="none" spellcheck="false"></label>
    <label class="f"><span class="lbl">Access token</span><span class="pwwrap">
      <input type="password" id="gt" placeholder="github_pat_…" autocapitalize="none" spellcheck="false">
      <button type="button" class="pweye" data-f="gt">Show</button></span></label>
    <p class="lockerr" id="err"></p>
    <button class="b p wide" id="go">Connect</button>
    <button class="b ghost wide" id="skip" style="margin-top:8px">Use this device only</button>
    <p class="hint" style="margin-top:14px">Make a <b>private</b> repository for the board, then a
      fine-grained token under GitHub → Settings → Developer settings, limited to that one
      repository with <b>Contents: Read and write</b>. The token stays on this device.</p>
    <p class="hint" style="margin-top:10px"><a href="#" id="sb">Use a Supabase database instead</a></p>
  </div>`;
  $$('#lock .pweye').forEach(b=>b.onclick=()=>{const f=$('#'+b.dataset.f);
    const s=f.type==='password';f.type=s?'text':'password';b.textContent=s?'Hide':'Show';f.focus()});
  $$('#lock input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter')$('#go').click()});
  $('#sb').onclick=e=>{e.preventDefault();cloudConnect()};
  $('#skip').onclick=()=>{ghForget();location.reload()};
  $('#go').onclick=async()=>{
    const m=/^\s*(?:https?:\/\/github\.com\/)?([\w.-]+)\/([\w.-]+?)(?:\.git)?\/?\s*$/.exec($('#gr').value);
    const tok=$('#gt').value.trim();
    if(!m)return $('#err').textContent='Write it as owner/repository.';
    if(tok.length<20)return $('#err').textContent='That token looks too short.';
    GH.owner=m[1];GH.repo=m[2];GH.token=tok;GH.branch='main';
    $('#err').textContent='Checking…';$('#go').disabled=true;
    try{
      const r=await ghApi(ghRepo(),{soft404:true});
      if(!r){$('#go').disabled=false;
        return $('#err').textContent='No such repository, or the token cannot see it.'}
      if(!r.permissions||!r.permissions.push){$('#go').disabled=false;
        return $('#err').textContent='That token can read but not write. Give it Contents: Read and write.'}
      if(r.private===false&&!confirm('That repository is public — anyone could read your board.\n\nConnect anyway?')){
        $('#go').disabled=false;return $('#err').textContent='Make the repository private, then try again.'}
      GH.branch=r.default_branch||'main';
      ghCfgSave();await ghStart();
    }catch(e){
      $('#go').disabled=false;
      $('#err').textContent=e.status===401?'That token was rejected. It may have expired.'
        :String(e.message||e).slice(0,120);
    }
  };
  setTimeout(()=>{const f=$('#gr');f&&(f.value?$('#gt'):f).focus()},240);
}
async function ghStart(){
  STORE.mode='github';STORE.label='Team repo · '+GH.owner+'/'+GH.repo;
  try{
    const raw=await ghLoad();
    if(raw){try{DB={...DB,...JSON.parse(raw)}}catch(e){}}
    if(!DB.people.length&&typeof SEED!=='undefined')mergeSeed();
    if((DB.authV||0)<3){DB.authV=3;DB.user='';DB.pass='';DB.recovery='';
      /* that migration forces a re-login, but on a shared password there is no
         local login to migrate — clearing here would drop the session the team
         password just created and bounce straight back to the lock screen */
      if(!GHENC)await clearSession()}
    if((DB.dataV||0)<2){DB.dataV=2;DB.updates=[];DB.allocs=[]}
    ghWatch();
    const s=await getSession();
    /* with a shared password the team password IS the login — don't ask twice */
    if(s&&s.role==='admin'&&(GHENC||DB.pass)){ADMIN=true;enter()}
    else if(GHENC)ghTeamLock();
    else lockScreen();
  }catch(e){
    if(GHENC&&(e.status===401||e.status===403)){ghForget();ghPinForget();return ghTeamLock()}
    ghConnect();
    setTimeout(()=>{const el=$('#err');if(el)el.textContent=
      e.status===401?'That token was rejected. It may have expired — paste a new one.'
      :String(e.message||e).slice(0,140)},60);
  }
}

/* ==================== storage ==================== */
/* Works in three places, picked automatically at boot:
   1. claude — shared workspace storage (inside Claude)
   2. file   — a JSON file on OneDrive / a network share, via the File System Access API
   3. local  — this browser only (downloaded copy, no shared file connected)         */
const STORE={mode:'memory',label:'Not saved',handle:null,mtime:0,pending:null};
let MEM={},SESSMEM=null;

function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('devsamosa',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const db=await idbOpen();return await new Promise(res=>{
  const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idbOpen();return await new Promise(res=>{
  const q=db.transaction('kv','readwrite').objectStore('kv').put(v,k);q.onsuccess=()=>res(1);q.onerror=()=>res(0)})}catch(e){return 0}}

async function initStore(){
  if(window.storage&&window.storage.get){
    STORE.mode='claude';STORE.label='Shared with everyone on this link';return;
  }
  try{
    const h=await idbGet('fileHandle');
    if(h){
      const perm=await h.queryPermission({mode:'readwrite'});
      if(perm==='granted'){STORE.handle=h;STORE.mode='file';STORE.label='Shared file · '+h.name;return}
      STORE.pending=h;
    }
  }catch(e){}
  try{localStorage.setItem('__ds','1');localStorage.removeItem('__ds');
    STORE.mode='local';STORE.label='This browser only';}
  catch(e){STORE.mode='memory';STORE.label='Not saved — export before closing'}
}
async function reconnectFile(){
  if(!STORE.pending)return false;
  try{
    if(await STORE.pending.requestPermission({mode:'readwrite'})==='granted'){
      STORE.handle=STORE.pending;STORE.pending=null;STORE.mode='file';
      STORE.label='Shared file · '+STORE.handle.name;return true;
    }
  }catch(e){}
  return false;
}
async function readRaw(key){
  if(STORE.mode==='github')return key===KEY?await ghLoad():null;
  if(STORE.mode==='cloud')return await cloudLoad();
  if(STORE.mode==='claude'){try{const r=await window.storage.get(key,true);return r&&r.value}catch(e){return null}}

async function hash(s){
  try{
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('devsamosa::'+s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){let h=0;const t='devsamosa::'+s;for(let i=0;i<t.length;i++){h=(h*31+t.charCodeAt(i))|0}return 'f'+h}
}

function merged(pid){
  const b=DB.allocs.filter(a=>a.personId===pid).map(a=>({s:a.start,e:a.end})).sort((x,y)=>x.s<y.s?-1:1),o=[];
  for(const x of b){const l=o[o.length-1];
    if(l&&D.diff(l.e,x.s)<=1)l.e=x.e>l.e?x.e:l.e; else o.push({...x})}
  return o;
}
function freeGaps(pid,from,to){
  const m=merged(pid).filter(x=>x.e>=from),g=[];let cur=from;
  for(const x of m){if(x.s>cur)g.push({s:cur,e:D.add(x.s,-1)});if(x.e>=cur)cur=D.add(x.e,1)}
  if(cur<=to)g.push({s:cur,e:to});
  return g.filter(x=>x.s<=to).map(x=>({s:x.s,e:x.e>to?to:x.e}));
}
function nextFree(pid){
  const t=D.today(),m=merged(pid).filter(x=>x.e>=t);
  if(!m.length||m[0].s>t)return nextWork(t);
  let cur=D.add(m[0].e,1);
  for(let i=1;i<m.length;i++){if(m[i].s>cur)break;cur=D.add(m[i].e,1)}
  return nextWork(cur);
}

function autoGrow(ta){ta.style.height='auto';ta.style.height=Math.max(28,ta.scrollHeight)+'px'}
function stripMarks(l){return l.replace(/^\s*(?:[•\-\*]|\d+[.)])\s*/,'').trim()}
function toggleList(ta,type){
  const lines=ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length)return;
  const re=type==='num'?/^\s*\d+[.)]\s+/:/^\s*[•\-\*]\s+/;
  const already=lines.every(l=>re.test(l));
  const bare=lines.map(stripMarks).filter(Boolean);
  ta.value=already?bare.join('\n')
    :bare.map((l,i)=>type==='num'?`${i+1}. ${l}`:`• ${l}`).join('\n');
  autoGrow(ta);
}
function listEnter(e,ta){
  const v=ta.value,p=ta.selectionStart;
  const ls=v.lastIndexOf('\n',p-1)+1;
  const m=v.slice(ls,p).match(/^(\s*)(?:(•|-|\*)|(\d+)[.)])\s+/);
  if(!m)return false;
  e.preventDefault();
  const ins='\n'+m[1]+(m[3]?`${+m[3]+1}. `:`${m[2]} `);
  ta.value=v.slice(0,p)+ins+v.slice(p);
  ta.selectionStart=ta.selectionEnd=p+ins.length;
  autoGrow(ta);
  return true;
}

function cellCommit(tr){

  const rec={personId:tr.dataset.p,projectId:tr.querySelector('.c-pr').value,task,
    est:+tr.querySelector('.c-es').value||0,
    spent:sp?(+sp.value||0):(prev?+prev.spent||0:0),
    status:tr.querySelector('.c-st').value};
  let id=tr.dataset.id;
  if(!id){
    if(!task)return;
    id=uid();DB.updates.push({id,date:day,...rec});tr.dataset.id=id;tr.classList.remove('ghost');
    const cell=tr.querySelector('td:last-child');
    if(!cell.querySelector('.del')){

      b.onclick=()=>{DB.updates=DB.updates.filter(u=>u.id!==id);save('Removed');render()};
      cell.appendChild(b);
    }
  }else{
    const rec0=DB.updates.find(x=>x.id===id);
    if(!rec0)return;
    Object.assign(rec0,rec);
  }
